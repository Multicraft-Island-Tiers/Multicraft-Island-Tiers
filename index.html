<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Leaderboard</title>
    <!-- Embedded Retro Gaming Font Link -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Base page layout */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background-color: #0b1d28; 
            overflow-x: hidden; 
        }
        
        #starfall-canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: -1; 
            pointer-events: none; 
        }
        
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 25px; 
            text-align: center; 
            z-index: 10; 
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 10px; 
            border: 1px solid rgba(100, 243, 229, 0.25);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.65);
        }
        
        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: row;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            z-index: 10;
        }
        
        .main-content-panel { 
            flex: 3;
            background: rgba(0, 0, 0, 0.6); 
            border: 2px solid #ffffff; 
            border-radius: 14px; 
            padding: 25px; 
            box-sizing: border-box; 
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
        }
        .main-content-panel.active-view { 
            display: block; 
        }
        
        /* MultiCraft Pixel Text Headers */
        .main-content-panel h2, .sidebar-panel h3 { 
            font-family: 'Press Start 2P', monospace;
            line-height: 1.5;
            margin-top: 0; 
            color: #64f3e5; 
            font-size: 1.25rem;
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 12px; 
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.2);
        }
        
        .sidebar-panel {
            flex: 1;
            background: rgba(14, 39, 53, 0.8);
            border: 2px solid #64f3e5;
            border-radius: 14px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            height: fit-content;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .sidebar-panel h3 {
            color: #e67e22;
            font-size: 1.05rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        
        .leaderboard-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        .leaderboard-table th, .leaderboard-table td { 
            padding: 14px 12px; 
            border: 1px solid #ffffff; 
            text-align: left; 
        }
        .leaderboard-table th { 
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            background-color: rgba(43, 122, 113, 0.9); 
        }
        .leaderboard-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .player-link-anchor { 
            background: none; 
            border: none; 
            color: #64f3e5; 
            font-weight: bold; 
            text-decoration: underline; 
            font-size: 1rem; 
            cursor: pointer; 
            padding: 0; 
            font-family: inherit; 
            text-align: left;
        }
        .player-link-anchor:hover { 
            color: #ffffff; 
            text-shadow: 0 0 8px #64f3e5; 
        }
        
        .profile-container-box {
            padding: 5px;
        }
        .close-action-trigger { 
            float: right; 
            background: #c0392b; 
            color: #ffffff; 
            border: 1px solid #ffffff; 
            border-radius: 6px; 
            padding: 6px 16px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 0.95rem;
        }
        .close-action-trigger:hover { 
            background: #e74c3c; 
        }
        
        .profile-card-header-title { 
            font-family: 'Press Start 2P', monospace;
            font-size: 1.4rem; 
            color: #64f3e5; 
            margin: 0 0 20px 0; 
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 12px; 
            word-break: break-all;
            margin-right: 60px;
        }
        .profile-metadata-matrix { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            margin-bottom: 25px; 
            background: rgba(255, 255, 255, 0.05); 
            padding: 15px; 
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .metadata-node {
            text-align: center;
        }
        .metadata-node strong {
            display: block;
            color: #64f3e5;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .metadata-node span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .profile-kit-metric-row { 
            background: rgba(255, 255, 255, 0.06); 
            padding: 14px 20px; 
            margin-bottom: 8px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border: 1px solid rgba(255,255,255,0.07);
        }
        .profile-kit-metric-row:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .profile-kit-metric-row span.kit-label-text {
            font-weight: 600;
            font-size: 1.05rem;
        }
        
        .profile-kit-metric-row span.tier-badge-node { 
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            font-weight: bold; 
            color: #0b1d28; 
            background: #64f3e5; 
            padding: 6px 12px; 
            border-radius: 6px; 
            box-shadow: 0 0 10px rgba(100, 243, 229, 0.25);
            border: 1px solid #ffffff;
        }
        
        .points-legend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .points-legend-item {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        .points-legend-item:last-child {
            border-bottom: none;
        }
        .points-legend-item span.tier-id-tag {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            font-weight: bold;
            color: #64f3e5;
        }
        .points-legend-item span.points-weight-tag {
            color: #e67e22;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .dashboard-layout-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .sidebar-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <canvas id="starfall-canvas"></canvas>
    <div class="logo-container"><img src="logo.png" alt="Multicraft Island Tiers Banner"></div>
    
    <div class="dashboard-layout-wrapper">
        <!-- Main Board Panel -->
        <div id="leaderboard-view-container" class="main-content-panel active-view">
            <h2>Overall Rankings</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Region</th>
                        <th>Device</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody id="live-leaderboard-rows-target"></tbody>
            </table>
        </div>

        <!-- Full Page Player Profile Display Slot -->
        <div id="player-profile-view-container" class="main-content-panel">
            <button class="close-action-trigger" onclick="clearActivePlayerParam()">X</button>
            <div id="live-profile-injection-target" class="profile-container-box"></div>
        </div>

        <!-- Points Legend Sidebar -->
        <div class="sidebar-panel">
            <h3>Tier Points System</h3>
            <ul class="points-legend-list">
                <li class="points-legend-item"><span class="tier-id-tag">HT1</span><span class="points-weight-tag">100 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">LT1</span><span class="points-weight-tag">85 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">HT2</span><span class="points-weight-tag">75 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">LT2</span><span class="points-weight-tag">60 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">HT3</span><span class="points-weight-tag">40 Pts</span></li>
