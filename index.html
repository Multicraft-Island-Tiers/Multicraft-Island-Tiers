<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Tiers | Roster Hub</title>
    <style>
        /* Load your exact font file extension locally */
        @font-face {
            font-family: 'MulticraftCustom';
            src: url('MultiCraftFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #02070c;
            background-image: radial-gradient(circle at 50% 50%, rgba(10, 24, 38, 0.75) 0%, rgba(2, 7, 12, 1) 100%);
            color: #ffffff;
            min-height: 100vh; 
            box-sizing: border-box;
        }
        
        .logo-container { max-width: 500px; width: 100%; margin-bottom: 25px; text-align: center; }
        .logo-container img { width: 100%; height: auto; border-radius: 12px; border: 1px solid rgba(100, 243, 229, 0.15); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }
        
        /* 27-FLIP LAYOUT GRID: Expanded layout max-width to allow wide cards to breathe */
        .dashboard-layout-wrapper { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 1250px; align-items: flex-start; }
        .main-content-panel { flex: 3; background: rgba(4, 11, 18, 0.45); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 22px; box-sizing: border-box; backdrop-filter: blur(12px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; }
        .menu-title { font-family: 'MulticraftCustom', monospace !important; color: #64f3e5; font-size: 1.2rem; margin: 0 0 20px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 14px; text-transform: uppercase; text-align: center; }

        /* ULTRA-WIDE COMPACT LEADERBOARD ROWS (Matching your new screenshot) */
        .roster-card-row { 
            display: flex; 
            align-items: center; 
            background: rgba(4, 13, 22, 0.65); 
            border: 1px solid rgba(100, 243, 229, 0.1); 
            border-radius: 6px; 
            padding: 8px 16px; 
            margin-bottom: 6px; 
            box-sizing: border-box; 
            gap: 16px; 
            width: 100%; 
            position: relative;
        }
        
        /* Highlight border for top positions */
        .roster-card-row:nth-child(2) { border-color: rgba(255, 215, 0, 0.3); box-shadow: 0 0 10px rgba(255, 215, 0, 0.05); }
        .roster-card-row:nth-child(3) { border-color: rgba(192, 192, 192, 0.3); }
        .roster-card-row:nth-child(4) { border-color: rgba(205, 127, 50, 0.3); }

        .row-rank-num { font-family: 'MulticraftCustom', monospace !important; font-size: 0.8rem; color: rgba(255, 255, 255, 0.3); width: 25px; text-align: center; }
        .roster-card-row:nth-child(2) .row-rank-num { color: #ffd700; }
        .roster-card-row:nth-child(3) .row-rank-num { color: #c0c0c0; }
        .roster-card-row:nth-child(4) .row-rank-num { color: #cd7f32; }
        
        /* Fixed Player info block */
        .player-info-block {
            display: flex;
            flex-direction: column;
            width: 160px;
            gap: 2px;
        }
        .row-player-name { font-family: 'MulticraftCustom', monospace !important; font-size: 0.85rem; font-weight: normal; color: #ffffff; text-transform: none !important; margin: 0; }
        .player-title-sub { font-size: 0.55rem; color: #64f3e5; opacity: 0.8; font-family: sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Badge groups layout */
        .player-badges-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* HORIZONTAL KITS DISPLAY AREA */
        .player-kits-row-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            padding: 0 10px;
            overflow-x: auto;
        }

        /* Small modular kit indicators matching screenshot rows */
        .kit-badge-indicator {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.55rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(2, 7, 12, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .kit-badge-indicator.em { color: #52be80; border-color: rgba(82, 190, 128, 0.3); }
        .kit-badge-indicator.dh { color: #e74c3c; border-color: rgba(231, 76, 60, 0.3); }
        .kit-badge-indicator.di { color: #5dade2; border-color: rgba(93, 189, 226, 0.3); }

        /* Far-right gold text value point layout */
        .row-points-total { font-family: 'MulticraftCustom', monospace !important; font-size: 0.8rem; color: #ffd700; min-width: 95px; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
        .row-points-total::before { content: "●"; color: #ffd700; font-size: 0.7rem; }

        .table-pill { font-size: 0.5rem; font-weight: bold; padding: 2px 4px; border-radius: 2px; text-transform: uppercase; font-family: 'Segoe UI', sans-serif; }
        .pill-na { color: #5dade2; border: 1px solid rgba(93, 189, 226, 0.25); background: rgba(93, 189, 226, 0.04); }
        .pill-eu { color: #f4d03f; border: 1px solid rgba(244, 208, 63, 0.25); background: rgba(244, 208, 63, 0.04); }
        .pill-pc { color: #af7ac5; border: 1px solid rgba(175, 122, 197, 0.25); background: rgba(175, 122, 197, 0.04); }
        .pill-mob { color: #52be80; border: 1px solid rgba(82, 190, 128, 0.25); background: rgba(82, 190, 128, 0.04); }
        .pill-con { color: #e59866; border: 1px solid rgba(229, 152, 102, 0.25); background: rgba(229, 152, 102, 0.04); }

        /* Sidebar Bounds precise formatting */
        .sidebar-wrapper-column { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 240px; box-sizing: border-box; }
        .sidebar-panel { background: rgba(4, 15, 25, 0.75); border: 1px solid rgba(86, 239, 170, 0.12); border-radius: 12px; padding: 18px; height: fit-content; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); width: 100%; }
        .sidebar-panel h3 { font-family: 'MulticraftCustom', monospace !important; color: #e67e22; font-size: 0.8rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 10px; margin: 0 0 10px 0; text-align: center; text-transform: uppercase; }
        .points-legend-list { list-style: none; padding: 0; margin: 0; }
        .points-legend-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 0.82rem; }
        .points-legend-item span.tier-id-tag { font-family: 'MulticraftCustom', monospace !important; font-size: 0.65rem; color: #56efaa; }
        .points-legend-item span.points-weight-tag { color: #e67e22; font-weight: 600; }

        .invite-badge-box { background: rgba(4, 15, 25, 0.9); border: 1.5px dashed #56efaa; border-radius: 8px; padding: 10px 14px; text-align: center; box-shadow: 0 0 15px rgba(86, 239, 170, 0.15); margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .invite-title { font-family: 'MulticraftCustom', monospace !important; font-size: 0.6rem; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; margin-bottom: 4px; }
        .invite-string { font-family: 'MulticraftCustom', monospace !important; font-size: 0.9rem; color: #56efaa; letter-spacing: 0.5px; }

        @media (max-width: 950px) { .dashboard-layout-wrapper { flex-direction: column; } .sidebar-wrapper-column { width: 100%; } }
    </style>
</head>
