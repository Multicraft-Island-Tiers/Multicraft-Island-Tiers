<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff; 
            min-height: 100vh;
            box-sizing: border-box;
            background-color: #0b1d28; 
            position: relative;
            overflow-x: hidden;
        }

        #starfall-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .logo-container {
            max-width: 600px;
            width: 100%;
            margin-bottom: 20px;
            text-align: center;
            z-index: 1;
        }

        .logo-container img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
        }

        .navigation-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 800px;
            z-index: 1;
        }

        .nav-btn {
            background-color: #1a4d47;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #2b7a71;
            box-shadow: 0 0 8px rgba(100, 243, 229, 0.4);
        }

        .nav-btn.overall-btn {
            background-color: #e67e22;
        }
        .nav-btn.overall-btn:hover, .nav-btn.overall-btn.active {
            background-color: #d35400;
        }

        .view-section {
            display: none;
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.4); 
            border: 2px solid #ffffff;       
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
            z-index: 1;
        }

        .view-section.active {
            display: block;
        }

        .view-section h2 {
            margin-top: 0;
            color: #64f3e5;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ffffff; 
        }

        .leaderboard-table th {
            background-color: rgba(43, 122, 113, 0.8);
            color: white;
        }

        .clickable-row {
            cursor: pointer;
            transition: background 0.2s;
        }

        .clickable-row:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .clickable-name {
            color: #64f3e5;
            font-weight: bold;
            text-decoration: underline;
        }

        .player-card-detail {
            border: 2px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
            background: rgba(0,0,0,0.3);
        }

        .player-card-title {
            font-size: 1.8rem;
            color: #64f3e5;
            margin-top: 0;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 5px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ffffff;
        }

        .tier-group {
            margin-bottom: 20px;
            border-radius: 6px;
            border: 2px solid #ffffff; 
            overflow: hidden;
            background: rgba(0,0,0,0.2);
        }

        .tier-header {
            color: white;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #ffffff;
        }

        .tier-header.ht { background: rgba(178, 59, 59, 0.85); }
        .tier-header.lt { background: rgba(59, 123, 178, 0.85); }
        .tier-header.tbd { background: rgba(127, 140, 141, 0.85); }

        .tier-list {
            padding: 10px 15px;
            list-style: none;
            margin: 0;
        }

        .tier-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .tier-list li:last-child {
            border-bottom: none;
        }

        .back-btn {
            background: #7f8c8d;
            color: white;
            border: 1px solid #fff;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .back-btn:hover {
            background: #95a5a6;
        }
    </style>
</head>
<body>

    <canvas id="starfall-canvas"></canvas>

    <div class="logo-container">
        <img src="logo.png" alt="Multicraft Island Tiers Logo">
    </div>

    <div class="navigation-menu">
        <button class="nav-btn overall-btn active" onclick="switchView('overall-view')">Overall Leaderboard</button>
        <button class="nav-btn" onclick="switchKitView('Dragonhide')">Dragonhide</button>
        <button class="nav-btn" onclick="switchKitView('Dragonhide KB')">Dragonhide KB</button>
        <button class="nav-btn" onclick="switchKitView('Emerald')">Emerald</button>
        <button class="nav-btn" onclick="switchKitView('Diamond')">Diamond</button>
        <button class="nav-btn" onclick="switchKitView('Emerald KB')">Emerald KB</button>
    </div>

    <!-- 1. OVERALL VIEW -->
    <div id="overall-view" class="view-section active">
        <h2>Overall Rankings</h2>
        <p>Click any player's row to view their complete Player Card and Tiers.</p>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Region</th>
                    <th>Device</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody id="leaderboard-data-rows"></tbody>
        </table>
    </div>

    <!-- 2. PLAYER PROFILE CARD VIEW -->
    <div id="player-view" class="view-section">
        <button class="back-btn" onclick="switchView('overall-view')">← Back to Leaderboard</button>
        <div id="player-card-container"></div>
    </div>

    <!-- 3. KITS HIERARCHY VIEW -->
    <div id="kit-view" class="view-section">
        <button class="back-btn" onclick="switchView('overall-view')">← Back to Leaderboard</button>
        <h2 id="kit-view-title">Kit Tiers</h2>
        <div id="tier-groups-container"></div>
    </div>

    <script>
        const tierPointsMapping = {
            "HT1": 100, "LT1": 90,
            "HT2": 80,  "LT2": 70,
            "HT3": 60,  "LT3": 50,
            "HT4": 40,  "LT4": 30,
            "HT5": 20,  "LT5": 10,
            "TBD": 0
        };

        // CENTRAL DATABASE (Usernames Capitalized)
        const playersDatabase = {
            "Husky_Multicraft": {
                name: "Husky_Multicraft", region: "NA", device: "PC",
                tiers: { "Dragonhide": "HT3", "Dragonhide KB": "HT3", "Emerald": "LT2", "Diamond": "HT3", "Emerald KB": "LT3" }
            },
            "Prologozrock": {
                name: "Prologozrock", region: "NA", device: "PC",
                tiers: { "Dragonhide": "LT4", "Dragonhide KB": "LT4", "Emerald": "LT3", "Diamond": "HT4", "Emerald KB": "TBD" }
            },
            "Parrot": {
                name: "Parrot", region: "NA", device: "Mobile",
                tiers: { "Dragonhide": "HT4", "Dragonhide KB": "HT5", "Emerald": "HT5", "Diamond": "HT4", "Emerald KB": "LT4" }
            },
            "Server_pvp": {
                name: "Server_pvp", region: "NA", device: "Mobile",
                tiers: { "Dragonhide": "LT4", "Dragonhide KB": "LT4", "Emerald": "HT5", "Diamond": "HT4", "Emerald KB": "HT5" }
            },
            "Taxbird": {
                name: "Taxbird", region: "NA", device: "Mobile",
                tiers: { "Dragonhide": "LT5", "Dragonhide KB": "LT5", "Emerald": "LT5", "Diamond": "LT5", "Emerald KB": "LT5" }
            }
        };

        function getPlayerTotalPoints(player) {
            let total = 0;
            for (const kit in player.tiers) {
                const tierCode = player.tiers[kit];
                total += tierPointsMapping[tierCode] || 0;
            }
            return total;
        }

        function buildOverallLeaderboard() {
            const playersWithCalculatedPoints = Object.values(playersDatabase).map(player => {
                return {
                    ...player,
                    calculatedPoints: getPlayerTotalPoints(player)
                };
            });

            playersWithCalculatedPoints.sort((a, b) => b.calculatedPoints - a.calculatedPoints);
            
            let tableHTML = '';
            playersWithCalculatedPoints.forEach((player, index) => {
                tableHTML += `
                    <tr class="clickable-row" onclick="showPlayerCard('\${player.name}')">
                        <td>#\${index + 1}</td>
