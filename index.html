<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Tiers | Roster Hub</title>
    <style>
        /* Load your exact font file extension locally */
        @font-face {
            font-family: 'MulticraftCustom';
            src: url('MultiCraftFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* UNIVERSAL CORE FIX: Forces 100% of all text, buttons, inputs, and pills to load your font */
        * {
            font-family: 'MulticraftCustom', monospace !important;
            font-weight: normal !important;
            text-transform: uppercase;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            padding: 30px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #02070c;
            background-image: radial-gradient(circle at 50% 50%, rgba(10, 24, 38, 0.75) 0%, rgba(2, 7, 12, 1) 100%);
            color: #ffffff;
            min-height: 100vh; 
        }
        
        .logo-container { max-width: 500px; width: 100%; margin-bottom: 25px; text-align: center; }
        .logo-container img { width: 100%; height: auto; border-radius: 12px; border: 1px solid rgba(100, 243, 229, 0.15); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }
        
        /* Premium Filter Navigation Bar horizontal menu options row */
        .top-nav-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; width: 100%; max-width: 1200px; }
        .nav-tab-trigger {
            background: rgba(4, 15, 24, 0.65); border: 1.5px solid rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.4);
            font-size: 0.58rem; padding: 6px 12px; border-radius: 6px; 
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s ease;
        }
        .nav-tab-trigger:hover, .nav-tab-trigger.active-trigger { color: #ffe082; border-color: #ffe082; background: rgba(255, 224, 130, 0.04); box-shadow: 0 0 12px rgba(255, 224, 130, 0.15); }
        
        /* BACKGROUND STRIPPER: Centers, zooms, and isolates your sword assets seamlessly inside button rows */
        .tab-weapon-icon-frame {
            width: 18px; height: 18px; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center;
            background: #030a10; border: 1px solid rgba(255,255,255,0.1); position: relative;
        }
        .tab-weapon-icon-frame img { width: 16px; height: 16px; image-rendering: pixelated; }

        /* FIXED WORKSPACE GRID: Strictly pins your columns side-by-side with zero alignment slips */
        .dashboard-layout-wrapper { display: flex; flex-direction: row; gap: 20px; width: 100%; max-width: 1200px; align-items: flex-start; }
        
        /* FORCE LONG vertical LINE: Ensures the leaderboard content panel stays in a straight down vertical track */
        .main-content-panel { flex: 3; background: rgba(4, 11, 18, 0.45); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 22px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; }
        .menu-title { color: #64f3e5; font-size: 1.2rem; margin: 0 0 20px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 14px; text-align: center; }

        /* Permanent Flat Leaderboard Rows */
        .roster-card-row { display: flex; align-items: center; background: rgba(4, 13, 22, 0.75); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; gap: 14px; width: 100%; }
        .row-rank-num { font-size: 0.8rem; color: rgba(255, 255, 255, 0.25); width: 35px; text-align: center; }
        .roster-card-row:nth-child(1) .row-rank-num { color: #ffd700; }
        .roster-card-row:nth-child(2) .row-rank-num { color: #c0c0c0; }
        .roster-card-row:nth-child(3) .row-rank-num { color: #cd7f32; }
        
        .row-player-name { font-size: 0.9rem; color: #ffffff; flex: 1; text-transform: none !important; }
        .row-points-total { font-size: 0.75rem; color: #ffd700; min-width: 85px; text-align: right; }

        .table-pill { font-size: 0.55rem; padding: 2px 6px; border-radius: 3px; display: inline-block; letter-spacing: 0.2px; }
        .pill-na { color: #5dade2; border: 1px solid rgba(93, 189, 226, 0.25); background: rgba(93, 189, 226, 0.04); }
        .pill-eu { color: #f4d03f; border: 1px solid rgba(244, 208, 63, 0.25); background: rgba(244, 208, 63, 0.04); }
        .pill-pc { color: #af7ac5; border: 1px solid rgba(175, 122, 197, 0.25); background: rgba(175, 122, 197, 0.04); }
        .pill-mob { color: #52be80; border: 1px solid rgba(82, 190, 128, 0.25); background: rgba(82, 190, 128, 0.04); }
        .pill-con { color: #e59866; border: 1px solid rgba(229, 152, 102, 0.25); background: rgba(229, 152, 102, 0.04); }

        /* SIDE-TO-SIDE SIDEBAR: Locked perfectly to the right side of your down line leaderboard layout column */
        .right-sidebar-column-wrapper { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 260px; }
        .sidebar-panel { background: rgba(4, 15, 25, 0.75); border: 1px solid rgba(86, 239, 170, 0.12); border-radius: 12px; padding: 18px; height: fit-content; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4); width: 100%; }
        .sidebar-panel h3 { color: #e67e22; font-size: 0.8rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 10px; margin: 0 0 10px 0; text-align: center; }
        .points-legend-list { list-style: none; padding: 0; margin: 0; }
        .points-legend-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 0.82rem; }
        .points-legend-item span.tier-id-tag { font-size: 0.65rem; color: #56efaa; }
        .points-legend-item span.points-weight-tag { color: #e67e22; }

        /* SOLID GREEN BOX: Positioned securely right ON TOP of the points system panel */
        .invite-badge-box { background: rgba(4, 15, 25, 0.9); border: 2px solid #56efaa; border-radius: 8px; padding: 12px 14px; text-align: center; box-shadow: 0 0 15px rgba(86, 239, 170, 0.2); width: 100%; }
        .invite-title { font-size: 0.6rem; color: rgba(255, 255, 255, 0.4); margin-bottom: 4px; }
        .invite-string { font-size: 0.95rem; color: #56efaa; letter-spacing: 0.5px; }

        @media (max-width: 900px) { .dashboard-layout-wrapper { flex-direction: column; } .right-sidebar-column-wrapper { width: 100%; } }
    </style>
</head>
