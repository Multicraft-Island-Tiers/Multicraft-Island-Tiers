<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Leaderboard</title>
    <style>
        /* Base page layout */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background-color: #0b1d28; 
            overflow-x: hidden; 
        }
        
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 25px; 
            text-align: center; 
            z-index: 10; 
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 10px; 
            border: 1px solid rgba(100, 243, 229, 0.25);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.65);
        }
        
        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: row;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            z-index: 10;
        }
        
        .main-content-panel { 
            flex: 3;
            background: rgba(0, 0, 0, 0.6); 
            border: 2px solid #ffffff; 
            border-radius: 14px; 
            padding: 25px; 
            box-sizing: border-box; 
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .main-content-panel h2, .sidebar-panel h3 { 
            margin-top: 0; 
            color: #64f3e5; 
            font-size: 1.6rem;
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 12px; 
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.2);
        }
        
        .sidebar-panel {
            flex: 1;
            background: rgba(14, 39, 53, 0.8);
            border: 2px solid #64f3e5;
            border-radius: 14px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            height: fit-content;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .sidebar-panel h3 {
            color: #e67e22;
        }
        
        .leaderboard-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        .leaderboard-table th, .leaderboard-table td { 
            padding: 14px 12px; 
            border: 1px solid #ffffff; 
            text-align: left; 
        }
        .leaderboard-table th { 
            background-color: rgba(43, 122, 113, 0.9); 
            font-weight: 600;
        }
        .leaderboard-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        /* Ultra-Clean High-Visibility Text Click Elements */
        .player-click-link { 
            color: #64f3e5; 
            font-weight: bold; 
            font-size: 1rem; 
            text-decoration: underline;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
        }
        .player-click-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #64f3e5;
        }
        
        /* Isolated Profile Screen Overlay Components */
        .profile-modal-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 29, 40, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* CSS State Target Selector Routing engine */
        .profile-modal-view:target {
            display: flex;
        }
        
        /* Premium split player interface card framework layout matching screenshot reference */
        .mtc-profile-card {
            width: 100%;
            max-width: 850px;
            background: #06131c;
            border: 2px solid rgba(100, 243, 229, 0.4);
            border-radius: 12px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(100, 243, 229, 0.15);
            position: relative;
            display: flex;
            flex-direction: row;
            gap: 40px;
        }
        
        .card-close-x-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }
        .card-close-x-btn:hover {
            background: #c0392b;
        }
        
        /* Left Section Details Column */
        .card-left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .rank-badge-node {
            background: rgba(230, 126, 34, 0.15);
            border: 1px solid #e67e22;
            color: #e67e22;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }
        .card-player-username {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0 0 15px 0;
        }
        .card-meta-pills {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .meta-pill {
            background: rgba(100, 243, 229, 0.1);
            border: 1px solid #64f3e5;
            color: #64f3e5;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .card-score-summary {
            font-size: 2.2rem;
            font-weight: bold;
            color: #f1c40f;
        }
        .card-score-summary span {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: normal;
            margin-left: 5px;
        }
        
        /* Right Section Kit Grid Column */
        .card-right-column {
            flex: 1.2;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding-left: 40px;
        }
        .right-column-title {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .kits-display-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .kit-metric-block {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .kit-name-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }
        .kit-tier-badge {
            font-size: 1.15rem;
            font-weight: bold;
            color: #64f3e5;
        }
        
        .points-legend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .points-legend-item {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        .points-legend-item:last-child {
            border-bottom: none;
        }
        .points-legend-item span.tier-id-tag {
            font-weight: bold;
            color: #64f3e5;
        }
        .points-legend-item span.points-weight-tag {
            color: #e67e22;
            font-weight: 600;
        }

        @media (max-width: 800px) {
            .dashboard-layout-wrapper, .mtc-profile-card {
                flex-direction: column;
            }
            .card-right-column {
                border-left: none;
                padding-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                padding-top: 25px;
            }
            .sidebar-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container"><img src="logo.png" alt="Multicraft Island Tiers Banner"></div>
    
    <div class="dashboard-layout-wrapper">
        <!-- Main Board Panel -->
        <div class="main-content-panel">
            <h2>Overall Rankings</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Region</th>
                        <th>Device</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>#1</td><td><a href="#p-husky" class="player-click-link">Husky_Multicraft</a></td><td>NA</td><td>PC</td><td><strong>180</strong></td></tr>
