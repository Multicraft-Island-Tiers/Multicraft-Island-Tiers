<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Leaderboard</title>
    <style>
        /* Base page layout */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background-color: #0b1d28; 
            overflow-x: hidden; 
        }
        
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 25px; 
            text-align: center; 
            z-index: 10; 
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 10px; 
            border: 1px solid rgba(100, 243, 229, 0.25);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.65);
        }
        
        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: row;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            z-index: 10;
        }
        
        .main-content-panel { 
            flex: 3;
            background: rgba(0, 0, 0, 0.6); 
            border: 2px solid #ffffff; 
            border-radius: 14px; 
            padding: 25px; 
            box-sizing: border-box; 
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .main-content-panel h2, .sidebar-panel h3 { 
            margin-top: 0; 
            color: #64f3e5; 
            font-size: 1.6rem;
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 12px; 
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.2);
        }
        
        .sidebar-panel {
            flex: 1;
            background: rgba(14, 39, 53, 0.8);
            border: 2px solid #64f3e5;
            border-radius: 14px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            height: fit-content;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .sidebar-panel h3 {
            color: #e67e22;
        }
        
        .leaderboard-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        .leaderboard-table th, .leaderboard-table td { 
            padding: 14px 12px; 
            border: 1px solid #ffffff; 
            text-align: left; 
        }
        .leaderboard-table th { 
            background-color: rgba(43, 122, 113, 0.9); 
            font-weight: 600;
        }
        .leaderboard-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        /* High-visibility active player path anchors */
        .player-anchor-link { 
            color: #64f3e5; 
            font-weight: bold; 
            font-size: 1rem;
            text-decoration: underline;
        }
        .player-anchor-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #64f3e5;
        }
        
        /* Points Breakdown text structure */
        .points-legend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .points-legend-item {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        .points-legend-item:last-child {
            border-bottom: none;
        }
        .points-legend-item span.tier-id-tag {
            font-weight: bold;
            color: #64f3e5;
        }
        .points-legend-item span.points-weight-tag {
            color: #e67e22;
            font-weight: 600;
        }

        /* --- STABLE CSS FLOATING PLAYER MODAL SYSTEM --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* Active route interceptor rule */
        .modal-overlay:target {
            display: flex;
        }

        .sample-player-card {
            width: 100%;
            max-width: 680px;
            background: #061520;
            border: 2px solid #1ba5b8;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(27, 165, 184, 0.4);
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            gap: 20px;
        }

        /* Premium X Close Target Anchor Button */
        .close-x-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .close-x-btn:hover {
            background: #c0392b;
            border-color: #ffffff;
        }

        /* Left Column Structure */
        .card-left-pane {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .badges-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .pill-badge {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .pill-rank { background: transparent; border: 1px solid #f1c40f; color: #f1c40f; }
        .pill-meta { background: transparent; border: 1px solid #9b59b6; color: #9b59b6; }
        
        .card-player-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #ffffff;
            word-break: break-all;
        }
        .avatar-placeholder-box {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
        }
        .points-large-text {
            font-size: 2rem;
            font-weight: bold;
            color: #f1c40f;
            margin-top: 15px;
        }
        .points-large-text span {
            font-size: 1rem;
            color: #ffffff;
            margin-left: 5px;
        }

        /* Right Column Kit Matrix Grid */
        .card-right-pane h4 {
            margin: 0 0 20px 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.5);
        }
        .kit-slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            row-gap: 20px;
        }
        .kit-slot-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .circle-frame {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid #f1c40f;
            background: rgba(0, 0, 0, 0.4);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .circle-frame.tbd-frame {
            border-color: rgba(255, 255, 255, 0.15);
            opacity: 0.3;
        }
        .kit-slot-cell span {
            font-size: 0.8rem;
            font-weight: bold;
            color: #f1c40f;
        }
        .kit-slot-cell span.tbd-text {
            color: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 700px) {
            .sample-player-card {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }

        @media (max-width: 900px) {
            .dashboard-layout-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .sidebar-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container"><img src="logo.png" alt="Multicraft Island Tiers Banner"></div>
    
    <div class="dashboard-layout-wrapper">
        <!-- Main Board Panel Component -->
        <div class="main-content-panel">
            <h2>Overall Rankings</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Region</th>
                        <th>Device</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>#1</td><td><a href="#p-Husky" class="player-anchor-link">Husky_Multicraft</a></td><td>NA</td><td>PC</td><td><strong>180</strong></td></tr>
