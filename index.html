<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Hub</title>
    <!-- Web-safe Fallback Gaming Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Base page layout - Dark outer space gaming atmosphere */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #060d13;
            background-image: radial-gradient(circle at 30% 20%, rgba(16, 44, 58, 0.4) 0%, rgba(5, 12, 18, 0.4) 100%),
                              radial-gradient(circle at 80% 70%, rgba(45, 14, 58, 0.35) 0%, rgba(5, 12, 18, 0.4) 100%);
            overflow-x: hidden; 
            color: #ffffff;
            min-height: 100vh; 
            box-sizing: border-box;
        }
        
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 25px; 
            text-align: center; 
            display: block;
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 12px; 
            border: 1px solid rgba(100, 243, 229, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        
        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1150px;
        }
        
        .main-content-panel { 
            flex: 3;
            background: rgba(0, 0, 0, 0.45); 
            border: 2px solid #ffffff; 
            border-radius: 16px; 
            padding: 25px; 
            box-sizing: border-box; 
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        
        .menu-title {
            font-family: 'Press Start 2P', monospace;
            color: #64f3e5;
            font-size: 1.15rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.3);
            border-bottom: 2px solid #ffffff;
            padding-bottom: 12px;
            line-height: 1.4;
        }
        
        /* Navigation Tabs Header Matrix Layout Frame */
        .top-nav-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1150px;
        }
        .nav-tab-trigger {
            background: rgba(14, 39, 53, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .nav-tab-trigger:hover, .nav-tab-trigger.active-trigger {
            color: #64f3e5;
            border-color: #64f3e5;
            background: rgba(100, 243, 229, 0.05);
            text-shadow: 0 0 8px rgba(100, 243, 229, 0.4);
        }
        
        /* Hidden layout controls to prevent script errors from freezing panels */
        .tab-panel-node { display: none; width: 100%; }
        .tab-panel-node.active-panel { display: block; }
        
        /* 5-Column Kit Tier Board Architecture */
        .tier-board-matrix {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            width: 100%;
            margin-top: 30px;
        }
        .tier-column-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 10px;
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.05);
        }
        .column-header-node {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: #64f3e5;
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(100, 243, 229, 0.2);
            padding-bottom: 8px;
        }

        /* Top 3 Podiums Arena settings */
        .podium-arena-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 25px;
            margin: 40px 0;
            width: 100%;
        }
        .podium-pedestal-node {
            background: rgba(10, 22, 31, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-sizing: border-box;
        }
        .podium-pedestal-node.first-place { border-color: #ffd700; order: 2; width: 180px; height: 200px; box-shadow: 0 0 25px rgba(255, 215, 0, 0.15); }
        .podium-pedestal-node.second-place { border-color: #c0c0c0; order: 1; width: 160px; height: 170px; }
        .podium-pedestal-node.third-place { border-color: #cd7f32; order: 3; width: 160px; height: 150px; }
        
        .podium-placement-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: auto;
        }
        .first-place .podium-placement-badge { color: #ffd700; }
        .second-place .podium-placement-badge { color: #c0c0c0; }
        .third-place .podium-placement-badge { color: #cd7f32; }

        /* Premium horizontal rows configuration architecture layout */
        .roster-card-row {
            display: flex;
            align-items: center;
            background: rgba(10, 22, 31, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 14px 20px;
            margin-bottom: 10px;
            box-sizing: border-box;
            gap: 15px;
            transition: all 0.2s;
        }
        .roster-card-row:hover {
            border-color: #64f3e5;
            background: rgba(14, 34, 48, 0.9);
            transform: scale(1.01);
            box-shadow: 0 0 15px rgba(100, 243, 229, 0.15);
        }
        
        .row-rank-num {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            width: 45px;
            text-align: center;
        }
        .roster-card-row:nth-child(1) .row-rank-num { color: #ffd700; }
        .roster-card-row:nth-child(2) .row-rank-num { color: #c0c0c0; }
        .roster-card-row:nth-child(3) .row-rank-num { color: #cd7f32; }

        .row-player-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            flex: 1;
        }
        
        .table-pill {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .pill-na { color: #5dade2; border: 1px solid #5dade2; background: rgba(93, 189, 226, 0.05); }
        .pill-eu { color: #f4d03f; border: 1px solid #f4d03f; background: rgba(244, 208, 63, 0.05); }
        .pill-pc { color: #af7ac5; border: 1px solid #af7ac5; background: rgba(175, 122, 197, 0.05); }
        .pill-mob { color: #52be80; border: 1px solid #52be80; background: rgba(82, 190, 128, 0.05); }
        .pill-con { color: #e59866; border: 1px solid #e59866; background: rgba(229, 152, 102, 0.05); }
        
        .row-points-total {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: #ffd700;
            min-width: 110px;
            text-align: right;
        }

        .sidebar-panel {
            flex: 1;
            background: rgba(14, 39, 53, 0.8);
            border: 2px solid #64f3e5;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            height: fit-content;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .sidebar-panel h3 {
            font-family: 'Press Start 2P', monospace;
            color: #e67e22;
            font-size: 0.85rem;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .points-legend-list { list-style: none; padding: 0; margin: 0; }
        .points-legend-item { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 0.95rem; }
        .points-legend-item:last-child { border-bottom: none; }
        .points-legend-item span.tier-id-tag { font-family: 'Press Start 2P', monospace; font-size: 0.6rem; color: #64f3e5; }
        .points-legend-item span.points-weight-tag { color: #e67e22; font-weight: 600; }

        @media (max-width: 950px) {
            .dashboard-layout-wrapper { flex-direction: column; align-items: center; }
            .sidebar-panel { width: 100%; }
            .tier-board-matrix { grid-template-columns: 1fr; }
            .podium-arena-wrapper { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="logo-container"><img src="logo.png" alt="Multicraft Island Tiers Banner"></div>
    
    <!-- Top Navigation Tabs Menu Layout Grid Triggers -->
    <div class="top-nav-bar">
