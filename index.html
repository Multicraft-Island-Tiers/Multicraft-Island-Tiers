<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multicraft Tier List</title>
  <style>
    :root {
      --bg-deep: #07131d;
      --bg-mid: #0b1a2a;
      --panel: rgba(10, 18, 28, 0.88);
      --panel-border: rgba(100, 243, 229, 0.3);
      --gold: #f8d457;
      --cyan: #8ef2ff;
      --lime: #7be5a6;
      --purple: #a77dff;
      --orange: #ffba5a;
      --text: #edf7ff;
      --muted: rgba(236, 244, 255, 0.76);
      --shadow: rgba(0, 0, 0, 0.6);
      --nav-bg: rgba(3, 8, 14, 0.78);
      --dialog-bg: rgba(4, 16, 24, 0.92);
      --dialog-border: rgba(70, 230, 255, 0.8);
      --dark-blue: rgba(8, 18, 28, 0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(45, 131, 155, 0.4), transparent 22%),
        radial-gradient(circle at 80% 12%, rgba(138, 85, 155, 0.45), transparent 25%),
        linear-gradient(180deg, #061924 0%, #0e1d2d 25%, #0b0d1a 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 15%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(2px 2px at 28% 28%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(1.5px 1.5px at 40% 18%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(1.5px 1.5px at 58% 30%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(2px 2px at 75% 18%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(2px 2px at 90% 22%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(1.5px 1.5px at 18% 77%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(1.5px 1.5px at 35% 60%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(2px 2px at 62% 75%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(1.5px 1.5px at 72% 67%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(2px 2px at 84% 58%, rgba(255,255,255,0.8), transparent 50%),
        radial-gradient(1.5px 1.5px at 92% 80%, rgba(255,255,255,0.8), transparent 50%);
      opacity: 0.9;
      pointer-events: none;
      z-index: 0;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.4; }
      100% { opacity: 0.95; }
    }

    .page-shell {
      position: relative;
      z-index: 1;
      max-width: 1300px;
      margin: 0 auto;
      padding: 18px 14px 30px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      background: rgba(8, 11, 18, 0.85);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 0;
      box-shadow: 0 0 0 1px rgba(50,50,50,0.15) inset;
      padding: 0 18px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      height: 100%;
    }

    .brand img {
      display: block;
      height: 42px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(130, 218, 255, 0.25));
    }

    .main-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      flex: 1;
      font-size: 11px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      font-weight: 700;
    }

    .main-links a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      opacity: 0.9;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .main-links a:hover,
    .main-links a.active {
      color: var(--cyan);
      opacity: 1;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 230px;
    }

    .search-box {
      width: min(24vw, 220px);
      min-width: 140px;
      height: 30px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.02);
      color: rgba(255,255,255,0.8);
      padding: 0 10px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      outline: none;
    }

    .search-box::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 0 18px;
      margin-bottom: 8px;
      position: relative;
    }

    .kit-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(5, 18, 28, 0.18);
      color: rgba(255,255,255,0.8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 112px;
      height: 38px;
      padding: 0 12px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.2s ease;
    }

    .kit-btn img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      opacity: 0.85;
    }

    .kit-btn:hover,
    .kit-btn.active {
      transform: translateY(-1px);
      border-color: rgba(255, 214, 10, 0.85);
      color: #ffe26b;
      box-shadow: 0 0 12px rgba(255,206,84,0.25);
    }

    .content-frame {
      width: min(100%, 940px);
      margin: 0 auto;
      background: rgba(8, 15, 22, 0.78);
      border: 1px solid rgba(126, 218, 255, 0.18);
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .leaderboard-head {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 800;
    }

    .roster-list {
      padding: 10px 18px 18px;
      min-height: 480px;
    }

    .roster-card-row {
      display: grid;
      grid-template-columns: 42px minmax(200px, 1.2fr) minmax(230px, 2.2fr) 120px;
      align-items: center;
      column-gap: 12px;
      min-height: 58px;
      padding: 7px 8px 7px 10px;
      border-radius: 8px;
      background: rgba(6, 14, 22, 0.7);
      border: 1px solid rgba(90, 135, 180, 0.16);
      margin-bottom: 10px;
    }

    .roster-card-row.hidden {
      display: none !important;
    }

    .row-rank-num {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.52);
      font-size: 17px;
      font-weight: 800;
      padding-left: 4px;
    }

    .visible-rank-1 .row-rank-num { color: #f3d64a; }
    .visible-rank-2 .row-rank-num { color: #d7dce7; }
    .visible-rank-3 .row-rank-num { color: #d59b64; }

    .player-info-container {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .player-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(175, 245, 255, 0.25), rgba(40, 90, 130, 0.7));
      border: 1px solid rgba(255,255,255,0.18);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: rgba(255,255,255,0.92);
    }

    .row-player-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      max-width: 100%;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .row-player-name:hover {
      color: var(--cyan);
    }

    .player-kits-display {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .tier-showcase-box {
      width: 38px;
      height: 42px;
      border-radius: 5px;
      padding: 3px 2px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 10, 16, 0.8);
      border: 1px solid rgba(255,255,255,0.1);
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text);
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .tier-showcase-box.green-border { border-color: rgba(88, 226, 146, 0.8); color: #80f0b2; }
    .tier-showcase-box.cyan-border { border-color: rgba(110, 217, 255, 0.8); color: #9ae7ff; }
    .tier-showcase-box.purple-border { border-color: rgba(179, 133, 255, 0.8); color: #c9a9ff; }
    .tier-showcase-box.orange-border { border-color: rgba(255, 174, 92, 0.8); color: #ffcc7f; }

    .tier-showcase-box img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      margin-bottom: 2px;
      display: block;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.08));
    }

    .tier-showcase-box span {
      font-size: 9px;
      letter-spacing: 0.4px;
      line-height: 1;
    }

    .row-points-total {
      justify-self: end;
      text-align: right;
      font-size: 14px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.8px;
      min-width: 90px;
      text-shadow: 0 0 10px rgba(255, 213, 74, 0.25);
    }

    .row-points-total::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--gold);
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 12px rgba(255, 217, 80, 0.5);
      vertical-align: middle;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      z-index: 999;
      padding: 20px;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .player-modal {
      position: relative;
      width: min(88vw, 760px);
      min-height: 390px;
      background: rgba(3, 12, 18, 0.91);
      border: 2px solid var(--dialog-border);
      border-radius: 14px;
      box-shadow: 0 0 0 2px rgba(95, 211, 255, 0.3), 0 0 18px rgba(92, 215, 255, 0.28);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
    }

    .modal-left {
      padding: 22px 18px 22px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .modal-info-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      height: 24px;
      border-radius: 14px;
      background: rgba(7, 12, 18, 0.7);
      border: 1px solid rgba(255, 207, 62, 0.7);
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 10px;
    }

    .player-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 78px;
      height: 23px;
      border-radius: 12px;
      background: rgba(8, 19, 24, 0.9);
      border: 1px solid rgba(110, 221, 255, 0.55);
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 8px;
    }

    .modal-player-name {
      margin: 18px 0 10px;
      font-size: clamp(2.2rem, 3vw, 3.8rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1px;
      color: rgba(255,255,255,0.96);
      text-shadow: 0 0 12px rgba(117, 221, 255, 0.15);
    }

    .small-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 24px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(10, 24, 30, 0.85);
      border: 1px solid rgba(111, 221, 255, 0.5);
      color: var(--cyan);
    }

    .mini-pill.pill-na { border-color: rgba(96, 203, 255, 0.7); color: #8fe6ff; }
    .mini-pill.pill-eu { border-color: rgba(255, 220, 99, 0.7); color: #ffe58a; }
    .mini-pill.pill-pc { border-color: rgba(181, 126, 255, 0.7); color: #d0aeff; }
    .mini-pill.pill-mob { border-color: rgba(125, 245, 182, 0.7); color: #99f7c9; }
    .mini-pill.pill-con { border-color: rgba(255, 170, 109, 0.7); color: #ffc68c; }

    .avatar-box {
      width: 100%;
      min-height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .avatar-cube {
      position: relative;
      width: 160px;
      height: 180px;
      transform: translateY(-6px);
      filter: drop-shadow(0 0 18px rgba(110, 220, 255, 0.15));
    }

    .avatar-cube .head {
      position: absolute;
      left: 52px;
      top: 18px;
      width: 52px;
      height: 45px;
      background: linear-gradient(180deg, #d0b382 0%, #8d6a4d 100%);
      border: 3px solid rgba(33, 25, 21, 0.9);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .avatar-cube .face {
      position: absolute;
      left: 57px;
      top: 28px;
      width: 42px;
      height: 28px;
      background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.15));
      border-radius: 3px;
    }

    .avatar-cube .eye {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(35, 28, 26, 0.95);
      border-radius: 1px;
      top: 39px;
    }

    .avatar-cube .eye.left { left: 68px; }
    .avatar-cube .eye.right { left: 89px; }

    .avatar-cube .body {
      position: absolute;
      left: 38px;
      top: 60px;
      width: 80px;
      height: 72px;
      background: linear-gradient(180deg, #52d5c3 0%, #2cae8e 100%);
      border: 3px solid rgba(25, 34, 32, 0.82);
      border-radius: 8px 8px 12px 12px;
    }

    .avatar-cube .arm {
      position: absolute;
      width: 18px;
      height: 48px;
      top: 70px;
      background: linear-gradient(180deg, #5ed4be 0%, #36ab91 100%);
      border: 3px solid rgba(25, 34, 32, 0.82);
      border-radius: 10px;
    }

    .avatar-cube .arm.left { left: 28px; transform: rotate(18deg); }
    .avatar-cube .arm.right { right: 28px; transform: rotate(-18deg); }

    .avatar-cube .leg {
      position: absolute;
      width: 18px;
      height: 56px;
      top: 120px;
      background: linear-gradient(180deg, #4c6d82 0%, #324d62 100%);
      border: 3px solid rgba(25, 34, 32, 0.82);
      border-radius: 10px;
    }

    .avatar-cube .leg.left { left: 55px; }
    .avatar-cube .leg.right { left: 90px; }

    .modal-total {
      color: var(--gold);
      font-size: clamp(2.2rem, 3vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .modal-total::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(255, 216, 84, 0.8);
    }

    .modal-right {
      position: relative;
      padding: 20px 18px 18px 10px;
      border-left: 1px solid rgba(255,255,255,0.04);
      background: rgba(0, 0, 0, 0.12);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      color: rgba(255,255,255,0.88);
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .close-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(15, 25, 32, 0.9);
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      cursor: pointer;
    }

    .kit-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(60px, 1fr));
      gap: 10px 12px;
      align-items: start;
      margin-top: 16px;
    }

    .kit-circle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 0 auto;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255, 214, 43, 0.9);
      background: rgba(8, 18, 24, 0.9);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 8px rgba(255, 205, 62, 0.13);
    }

    .kit-circle img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
    }

    .kit-circle span {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--gold);
      letter-spacing: 0.4px;
    }

    .modal-footer {
      position: absolute;
      right: 18px;
      bottom: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.16);
      color: rgba(255,255,255,0.7);
      background: rgba(10, 18, 20, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .topbar {
        height: auto;
        flex-wrap: wrap;
        padding: 12px 14px;
        gap: 10px;
      }

      .brand, .search-wrap {
        min-width: 0;
        width: 100%;
        justify-content: center;
      }

      .main-links {
        width: 100%;
        flex-wrap: wrap;
      }

      .content-frame {
        width: 100%;
      }

      .roster-card-row {
        grid-template-columns: 32px minmax(150px, 1fr) 1fr 80px;
      }

      .player-info-container {
        gap: 8px;
      }

      .player-modal {
        grid-template-columns: 1fr;
      }

      .modal-right {
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.04);
        padding-top: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="Multicraft Logo">
      </div>

      <nav class="main-links" aria-label="Main navigation">
        <a href="#" class="active">Home</a>
      </nav>

      <div class="search-wrap">
        <input class="search-box" type="text" placeholder="Search Player..." aria-label="Search player">
      </div>
    </header>

    <div class="filter-bar" id="filter-bar">
      <button class="kit-btn active" data-kit="all" type="button">
        <img src="overall.png" alt="Overall"><span>Overall</span>
      </button>
      <button class="kit-btn" data-kit="emerald" type="button">
        <img src="Emerald.png" alt="Emerald"><span>Emerald</span>
      </button>
      <button class="kit-btn" data-kit="emerald-kb" type="button">
        <img src="Emerald_KB.png" alt="Emerald KB"><span>Emerald KB</span>
      </button>
      <button class="kit-btn" data-kit="dragonhide-kb" type="button">
        <img src="Dragonhide_KB.png" alt="Dragonhide KB"><span>Dragonhide KB</span>
      </button>
      <button class="kit-btn" data-kit="dragonhide" type="button">
        <img src="Dragonhide.png" alt="Dragonhide"><span>Dragonhide</span>
      </button>
      <button class="kit-btn" data-kit="diamond" type="button">
        <img src="Diamond.png" alt="Diamond"><span>Diamond</span>
      </button>
    </div>

    <main class="content-frame">
      <div class="leaderboard-head" id="leaderboard-title">Overall Leaderboard</div>
      <div id="roster-list-container" class="roster-list"></div>
    </main>
  </div>

  <div id="player-modal" class="modal-backdrop" aria-hidden="true">
    <div class="player-modal" role="dialog" aria-modal="true" aria-labelledby="modal-player-name">
      <div class="modal-left">
        <div class="modal-info-strip">
          <span id="modal-rank" class="rank-badge">RANK #3</span>
          <span id="modal-role" class="player-badge">Combat Master</span>
        </div>

        <div>
          <div id="modal-player-name" class="modal-player-name">sample</div>
          <div class="small-pills" id="modal-pills"></div>
        </div>

        <div class="avatar-box">
          <div class="avatar-cube" aria-hidden="true">
            <div class="head"></div>
            <div class="face"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
          </div>
        </div>

        <div id="modal-total" class="modal-total">240 PTS</div>
      </div>

      <div class="modal-right">
        <div class="modal-header">
          <div class="modal-title">Kit Rankings</div>
          <button id="close-modal" class="close-btn" aria-label="Close">×</button>
        </div>

        <div id="kit-grid" class="kit-grid"></div>
        <div class="modal-footer">⎈</div>
      </div>
    </div>
  </div>

  <script>
    const pointMatrix = {
      'HT1': 100,
      'LT1': 85,
      'HT2': 75,
      'LT2': 60,
      'HT3': 40,
      'LT3': 30,
      'HT4': 25,
      'LT4': 15,
      'HT5': 8,
      'LT5': 3
    };

    const tierClassMap = {
      'HT1': 'green-border',
      'LT1': 'cyan-border',
      'HT2': 'green-border',
      'LT2': 'cyan-border',
      'HT3': 'purple-border',
      'LT3': 'purple-border',
      'HT4': 'green-border',
      'LT4': 'cyan-border',
      'HT5': 'green-border',
      'LT5': 'orange-border'
    };

    const assetsForKit = {
      emerald: 'Emerald.png',
      'emerald-kb': 'Emerald_KB.png',
      dragonhide: 'Dragonhide.png',
      'dragonhide-kb': 'Dragonhide_KB.png',
      diamond: 'Diamond.png'
    };

    let filteredPlayers = [];
    let currentKitFilter = 'all';

    function normalizeKitSlug(value) {
      return String(value || '').trim().toLowerCase().replace(/\s+/g, '-');
    }

    function getKitAssetName(kitName) {
      const slug = normalizeKitSlug(kitName);
      return assetsForKit[slug] || 'logo.png';
    }

    function getRegionClass(region) {
      const key = String(region || '').toUpperCase();
      if (key === 'NA') return 'pill-na';
      if (key === 'EU') return 'pill-eu';
      if (key === 'PC') return 'pill-pc';
      if (key === 'MOB') return 'pill-mob';
      if (key === 'CTRL') return 'pill-con';
      return 'pill-na';
    }

    function renderRows(players) {
      const container = document.getElementById('roster-list-container');
      container.innerHTML = '';

      const rows = players.map((player, index) => {
        const kitBoxes = (player.achievements || []).map(item => {
          const tier = item.tier || 'LT5';
          const kitName = normalizeKitSlug(item.kit);
          const asset = getKitAssetName(kitName);
          return `
            <div class="tier-showcase-box ${tierClassMap[tier] || 'green-border'}">
              <img src="${asset}" alt="${item.kit}">
              <span>${tier}</span>
            </div>
          `;
        }).join('');

        const displayName = player.name || 'Unknown';
        const avatarText = displayName.slice(0, 2).toUpperCase();
        const safeName = displayName.replace(/"/g, '&quot;');

        return `
          <div class="roster-card-row" data-points="${player.totalPoints || 0}" data-name="${safeName}" data-rank="${index + 1}">
            <div class="row-rank-num">#${index + 1}</div>
            <div class="player-info-container">
              <div class="player-avatar">${avatarText}</div>
              <span class="row-player-name" data-player-name="${safeName}">${displayName}</span>
            </div>
            <div class="player-kits-display">${kitBoxes}</div>
            <div class="row-points-total">${player.totalPoints || 0} PTS</div>
          </div>
        `;
      }).join('');

      container.innerHTML = rows;
      attachRowRanks();
      bindPlayerClickHandlers();
    }

    function attachRowRanks() {
      const rows = [...document.querySelectorAll('.roster-card-row')];
      rows.forEach((row, index) => {
        const rank = index + 1;
        const rankEl = row.querySelector('.row-rank-num');
        rankEl.textContent = '#' + rank;

        row.classList.remove('visible-rank-1', 'visible-rank-2', 'visible-rank-3');
        if (rank === 1) row.classList.add('visible-rank-1');
        if (rank === 2) row.classList.add('visible-rank-2');
        if (rank === 3) row.classList.add('visible-rank-3');
      });
    }

    function bindPlayerClickHandlers() {
      document.querySelectorAll('.row-player-name').forEach(nameEl => {
        nameEl.addEventListener('click', () => {
          const row = nameEl.closest('.roster-card-row');
          const playerName = nameEl.dataset.playerName || row.dataset.name || nameEl.textContent.trim();
          const player = filteredPlayers.find(p => p.name === playerName) || filteredPlayers.find(p => String(p.name).toLowerCase() === String(playerName).toLowerCase());

          if (!player) return;
          openPlayerModal(player, Number(row.dataset.rank || 1));
        });
      });
    }

    function openPlayerModal(player, rank) {
      const modal = document.getElementById('player-modal');
      const rankNode = document.getElementById('modal-rank');
      const nameNode = document.getElementById('modal-player-name');
      const totalNode = document.getElementById('modal-total');
      const pillsNode = document.getElementById('modal-pills');
      const kitGrid = document.getElementById('kit-grid');

      rankNode.textContent = 'RANK #' + rank;
      nameNode.textContent = player.name || 'Unknown';
      totalNode.textContent = `${player.totalPoints || 0} PTS`;

      pillsNode.innerHTML = '';
      (player.regions || []).forEach(region => {
        const pill = document.createElement('span');
        pill.className = 'mini-pill ' + getRegionClass(region);
        pill.textContent = region;
        pillsNode.appendChild(pill);
      });
      (player.platforms || []).forEach(platform => {
        const pill = document.createElement('span');
        pill.className = 'mini-pill ' + getRegionClass(platform);
        pill.textContent = platform;
        pillsNode.appendChild(pill);
      });

      kitGrid.innerHTML = '';
      (player.achievements || []).forEach(item => {
        const circle = document.createElement('div');
        circle.className = 'kit-circle';
        circle.innerHTML = `
          <img src="${getKitAssetName(item.kit)}" alt="${item.kit}">
          <span>${item.tier}</span>
        `;
        kitGrid.appendChild(circle);
      });

      modal.classList.add('visible');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closePlayerModal() {
      const modal = document.getElementById('player-modal');
      modal.classList.remove('visible');
      modal.setAttribute('aria-hidden', 'true');
    }

    function applyFilter() {
      const rows = [...document.querySelectorAll('.roster-card-row')];
      if (!rows.length) return;

      const visibleRows = rows.filter(row => {
        if (currentKitFilter === 'all') return true;
        const kitNames = [...row.querySelectorAll('.tier-showcase-box img')].map(img => normalizeKitSlug(img.getAttribute('alt')));
        return kitNames.includes(currentKitFilter);
      });

      const sortedRows = visibleRows.sort((a, b) => Number(b.dataset.points || 0) - Number(a.dataset.points || 0) || String(a.dataset.name).localeCompare(String(b.dataset.name)));

      rows.forEach(row => row.classList.add('hidden'));
      sortedRows.forEach((row, index) => {
        row.classList.remove('hidden');
        row.dataset.rank = index + 1;
        row.querySelector('.row-rank-num').textContent = '#' + (index + 1);
      });

      const title = document.getElementById('leaderboard-title');
      const label = currentKitFilter === 'all' ? 'Overall Leaderboard' : currentKitFilter.replace(/-/g, ' ').toUpperCase() + ' Leaderboard';
      title.textContent = label;
    }

    function loadPlayers() {
      fetch('players.json')
        .then(res => res.json())
        .then(data => {
          filteredPlayers = data.sort((a, b) => Number(b.totalPoints || 0) - Number(a.totalPoints || 0) || String(a.name).localeCompare(String(b.name)));
          renderRows(filteredPlayers);
          applyFilter();
        })
        .catch(err => {
          console.error('Failed to load players:', err);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPlayers();

      document.querySelectorAll('.kit-btn').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.kit-btn').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          currentKitFilter = button.dataset.kit;
          applyFilter();
        });
      });

      const searchInput = document.querySelector('.search-box');
      searchInput.addEventListener('input', (event) => {
        const query = event.target.value.trim().toLowerCase();
        const data = filteredPlayers.filter(player => String(player.name || '').toLowerCase().includes(query));
        renderRows(data);
        applyFilter();
      });

      document.getElementById('close-modal').addEventListener('click', closePlayerModal);
      document.getElementById('player-modal').addEventListener('click', (event) => {
        if (event.target === event.currentTarget) closePlayerModal();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closePlayerModal();
      });
    });
  </script>
</body>
</html>
