<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTC Tiers | Roster Hub</title>
    <style>
        /* Embeds your custom truetype font file */
        @font-face {
            font-family: 'MulticraftCustom';
            src: url('MultiCraftFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #02070c;
            /* Rich space galaxy gradient styling background bounds */
            background-image: radial-gradient(circle at 30% 50%, rgba(13, 38, 41, 0.6) 0%, rgba(2, 7, 12, 1) 70%),
                              radial-gradient(circle at 80% 40%, rgba(39, 13, 46, 0.4) 0%, rgba(2, 7, 12, 1) 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- SCREEN HEADER LINKS NAVBAR --- */
        .top-global-header {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 15px 0;
            background: rgba(2, 7, 12, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 25px;
        }
        .header-nav-link {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }
        .header-nav-link:hover, .header-nav-link.active {
            color: #64f3e5;
            text-shadow: 0 0 8px rgba(100, 243, 229, 0.4);
        }

        /* --- LAYOUT WRAPPER GRID CONTAINER --- */
        .dashboard-layout-wrapper { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            max-width: 1000px; 
            padding: 0 20px 40px 20px;
            box-sizing: border-box;
        }

        /* --- PRIMARY NAV FILTERS BLOCK --- */
        .kit-navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .kit-btn {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.52rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(4, 11, 18, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .kit-btn:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
        }
        .kit-btn.active {
            color: #ffd700;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.04);
            box-shadow: inset 0 0 8px rgba(255, 215, 0, 0.1), 0 0 10px rgba(255, 215, 0, 0.15);
        }

        /* --- DROP-DOWN SUB-FILTER CRITERIA SELECTION BAR --- */
        .sub-filter-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-label-text {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
        }
        .custom-select-box {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.55rem;
            background: rgba(4, 11, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 6px 24px 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='10' height='10' fill='white'><polygon points='0,3 10,3 5,8'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
        }

        /* --- OVERALL CENTRIC LEADERBOARD MAIN SHEET --- */
        .main-content-panel { 
            width: 100%;
            display: flex; 
            flex-direction: column;
        }

        .roster-card-row { 
            display: flex; 
            align-items: center; 
            background: rgba(3, 9, 16, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.04); 
            border-radius: 8px; 
            padding: 8px 16px; 
            margin-bottom: 6px; 
            box-sizing: border-box; 
            gap: 15px; 
            width: 100%; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .roster-card-row:hover {
            border-color: rgba(100, 243, 229, 0.25);
            background: rgba(4, 13, 24, 0.85);
        }
        .roster-card-row.hidden { display: none !important; }

        /* --- VALUE METRIC TEXT PLACEMENT COLUMNS --- */
        .row-rank-num { 
            font-family: 'MulticraftCustom', monospace !important; 
            font-size: 1rem; 
            color: rgba(255, 255, 255, 0.3); 
            width: 30px; 
            text-align: center;
            flex-shrink: 0;
        }

        /* --- PLAYER PROFILE MODULE LAYOUTS --- */
        .player-info-container { display: flex; align-items: center; width: 220px; gap: 12px; flex-shrink: 0; }
        
        .player-avatar-box {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: #152737;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-avatar-box img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

        .player-name-block { display: flex; flex-direction: column; gap: 2px; }
        .row-player-name { font-family: 'MulticraftCustom', monospace !important; font-size: 0.85rem; font-weight: normal; color: #ffffff; margin: 0; }

        /* --- DEVICE CHANNELS PLATFORM PILLS --- */
        .device-badge-group { display: flex; gap: 5px; flex-shrink: 0; width: 75px; }
        .table-pill { font-size: 0.5rem; font-weight: bold; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; display: inline-block; font-family: 'Segoe UI', sans-serif; letter-spacing: 0.5px; flex-shrink: 0; }
        .pill-na { color: #4facfe; border: 1px solid rgba(79, 172, 254, 0.2); background: rgba(79, 172, 254, 0.05); }
        .pill-eu { color: #fccb90; border: 1px solid rgba(252, 203, 144, 0.2); background: rgba(252, 203, 144, 0.05); }
        .pill-pc { color: #00f2fe; border: 1px solid rgba(0, 242, 254, 0.2); background: rgba(0, 242, 254, 0.05); }
        .pill-mob { color: #45f545; border: 1px solid rgba(69, 245, 69, 0.2); background: rgba(69, 245, 69, 0.05); }
        .pill-con { color: #ff9900; border: 1px solid rgba(255, 153, 0, 0.2); background: rgba(255, 153, 0, 0.05); }

        /* --- NO-SCROLL INTEGRATED KIT SHOWCASE PANELS --- */
        .player-kits-display { 
            display: flex; 
            gap: 6px; 
            flex: 1; 
            justify-content: flex-start; 
            align-items: center;
            min-width: 0; 
        }
        
        .tier-showcase-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 46px;
            border-radius: 5px;
            background: rgba(2, 7, 12, 0.6);
            box-sizing: border-box;
            padding: 2px;
            flex-shrink: 0;
        }
        .tier-showcase-box.green-border { border: 1px solid rgba(85, 255, 85, 0.35); color: #55ff55; }
        .tier-showcase-box.cyan-border { border: 1px solid rgba(85, 255, 255, 0.35); color: #55ffff; }
        .tier-showcase-box.purple-border { border: 1px solid rgba(175, 122, 197, 0.35); color: #af7ac5; }
        .tier-showcase-box.orange-border { border: 1px solid rgba(255, 170, 0, 0.35); color: #ffaa00; }

        .tier-showcase-box img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            margin-bottom: 2px;
            background: transparent !important;
            mix-blend-mode: color-dodge; /* Completely drops gray weapon bounding squares */
            filter: brightness(1.2) contrast(1.15);
        }
        .tier-showcase-box span {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.42rem;
            text-transform: uppercase;

    <!-- DYNAMIC INTERACTIVE CORE ENGINE -->
    <script>
        let currentKitFilter = 'all';

        function openPlayerModal(name, points, kitsObj) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalPoints').innerText = points;
            
            const gridContainer = document.getElementById('modalKitsGrid');
            gridContainer.innerHTML = '';
            
            for (const [kit, tier] of Object.entries(kitsObj)) {
                const row = document.createElement('div');
                row.className = 'modal-kit-row';
                row.innerHTML = `<span>${kit}</span><span class="tier-val">${tier}</span>`;
                gridContainer.appendChild(row);
            }
            
            document.getElementById('playerModal').classList.add('active');
        }

        function closePlayerModal(e) {
            if (e.target.id === 'playerModal') {
                document.getElementById('playerModal').classList.remove('active');
            }
        }

        function closePlayerModalForce() {
            document.getElementById('playerModal').classList.remove('active');
        }

        function filterKit(kitName, btnElement) {
