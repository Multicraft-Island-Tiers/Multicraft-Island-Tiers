<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Leaderboard</title>
    <!-- Web-safe gaming font look fallback -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Base page layout */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background-color: #0b1d28; 
            overflow-x: hidden; 
        }
        
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 25px; 
            text-align: center; 
            z-index: 10; 
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 10px; 
            border: 1px solid rgba(100, 243, 229, 0.25);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.65);
        }
        
        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: row;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            z-index: 10;
        }
        
        .main-content-panel { 
            flex: 3;
            background: rgba(0, 0, 0, 0.6); 
            border: 2px solid #ffffff; 
            border-radius: 14px; 
            padding: 25px; 
            box-sizing: border-box; 
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .main-content-panel h2, .sidebar-panel h3 { 
            line-height: 1.5;
            margin-top: 0; 
            color: #64f3e5; 
            font-size: 1.6rem;
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 12px; 
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.2);
        }
        
        .sidebar-panel {
            flex: 1;
            background: rgba(14, 39, 53, 0.8);
            border: 2px solid #64f3e5;
            border-radius: 14px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            height: fit-content;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .sidebar-panel h3 {
            color: #e67e22;
            font-size: 1.2rem;
        }
        
        .leaderboard-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        .leaderboard-table th, .leaderboard-table td { 
            padding: 14px 12px; 
            border: 1px solid #ffffff; 
            text-align: left; 
        }
        .leaderboard-table th { 
            background-color: rgba(43, 122, 113, 0.9); 
            font-weight: bold;
        }
        .leaderboard-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        /* Safe target anchors style */
        .player-link-anchor { 
            color: #64f3e5; 
            font-weight: bold; 
            text-decoration: underline; 
            font-size: 1rem; 
            cursor: pointer;
        }
        .player-link-anchor:hover { 
            color: #ffffff; 
            text-shadow: 0 0 8px #64f3e5; 
        }
        
        /* 100% Stable CSS-Overlay Panel Core Engine */
        .profile-overlay-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 12, 17, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* Unbreakable direct-target visibility activator toggle switch */
        .profile-overlay-container:target {
            display: flex;
        }
        
        /* Premium split player box panel directly matching your screenshot reference layout */
        .premium-profile-card {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 820px;
            background: #06131c;
            border: 2px solid rgba(100, 243, 229, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(100, 243, 229, 0.15);
            overflow: hidden;
            position: relative;
        }
        
        .close-x-trigger {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: none;
            font-size: 0.9rem;
            font-weight: bold;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        .close-x-trigger:hover {
            background: rgba(192, 57, 43, 0.8);
        }
        
        /* Left Panel Node Layout */
        .card-left-column {
            flex: 1;
            padding: 35px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }
        .rank-badge {
            font-weight: bold;
            font-size: 0.75rem;
            color: #ffd700;
            border: 1.5px solid #ffd700;
            padding: 4px 10px;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .card-player-title {
            font-size: 1.8rem;
            color: #ffffff;
            margin: 0 0 15px 0;
            word-break: break-all;
        }
        .tags-row {
            display: flex;
            gap: 8px;
            margin-bottom: auto;
        }
        .meta-pill {
            font-weight: bold;
            font-size: 0.7rem;
            color: #ef5350;
            border: 1px solid #ef5350;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .meta-pill.device-pill {
            color: #ab47bc;
            border-color: #ab47bc;
        }
        .score-display-node {
            font-size: 1.75rem;
            font-weight: bold;
            color: #ffd700;
            margin-top: 30px;
        }
        .score-display-node span {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 5px;
        }
        
        /* Right Panel Grid Layout */
        .card-right-column {
            flex: 1.2;
            padding: 35px;
            box-sizing: border-box;
        }
        .right-column-header {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            margin: 0 0 25px 0;
        }
        .kits-display-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .kit-slot-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .circle-frame {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
            font-weight: bold;
            color: #ffffff;
            font-size: 1rem;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.1);
        }
        .circle-frame.empty-frame {
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
        .kit-slot-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
        }
        
        .points-legend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .points-legend-item {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        .points-legend-item:last-child {
            border-bottom: none;
        }
        .points-legend-item span.tier-id-tag {
            font-weight: bold;
            color: #64f3e5;
        }
        .points-legend-item span.points-weight-tag {
            color: #e67e22;
            font-weight: 600;
        }

        @media (max-width: 800px) {
            .dashboard-layout-wrapper, .premium-profile-card {
                flex-direction: column;
                align-items: center;
            }
            .sidebar-panel, .card-left-column {
                width: 100%;
            }
            .card-left-column {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>
<body>
    <div class="logo-container"><img src="logo.png" alt="Multicraft Island Tiers Banner"></div>
    
    <div class="dashboard-layout-wrapper">
        <!-- Main Board Panel (100% Core HTML - Physically Impossible to Hide Players) -->
        <div class="main-content-panel">

            }
