<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Hub</title>
    <style>
        /* Native Custom Typography Loading Engine */
        @font-face {
            font-family: 'MulticraftCustom';
            src: url('Multicraft.font.tff') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Base App Structure - Space Cosmic Ambiance */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #02070c;
            background-image: radial-gradient(circle at 50% 50%, rgba(10, 24, 38, 0.7) 0%, rgba(2, 7, 12, 1) 100%);

        .logo-container { max-width: 500px; width: 100%; margin-bottom: 20px; text-align: center; }

        /* Navigation Controls Header Row */
        .top-nav-bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; width: 100%; max-width: 1200px; }
        .nav-tab-trigger {

            font-family: 'MulticraftCustom', monospace, sans-serif; font-size: 0.7rem; padding: 10px 14px; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease;
        }
        .nav-tab-trigger:hover, .nav-tab-trigger.active-trigger { color: #56efaa; border-color: #56efaa; background: rgba(86, 239, 170, 0.04); }
        
        /* Viewport Display Layout Elements */
        .tab-panel-node { display: none; width: 100%; max-width: 1200px; }
        
        .dashboard-layout-wrapper { display: flex; flex-direction: row; gap: 25px; width: 100%; }
        .main-content-panel { flex: 3; background: rgba(4, 11, 18, 0.45); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 22px; box-sizing: border-box; backdrop-filter: blur(12px); }
        .menu-title { font-family: 'MulticraftCustom', monospace, sans-serif; color: #64f3e5; font-size: 1.2rem; margin: 0 0 20px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 14px; text-transform: uppercase; text-align: center; }

        /* Leaderboard Rows Base Architecture Styles */
        .roster-card-row { display: flex; align-items: center; background: rgba(4, 13, 22, 0.75); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; box-sizing: border-box; gap: 14px; cursor: pointer; }

        .roster-card-row:nth-child(2) .row-rank-num { color: #c0c0c0; }
        .roster-card-row:nth-child(3) .row-rank-num { color: #cd7f32; }
        .row-player-name { font-size: 1rem; font-weight: 700; color: #ffffff; flex: 1; }
        .row-points-total { font-family: 'MulticraftCustom', monospace, sans-serif; font-size: 0.75rem; color: #ffd700; min-width: 85px; text-align: right; }

        /* Universal Badges Group */
        .table-pill { font-size: 0.55rem; font-weight: bold; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; display: inline-block; font-family: 'Segoe UI', sans-serif; }

        .pill-mob { color: #52be80; border: 1px solid rgba(82, 190, 128, 0.25); background: rgba(82, 190, 128, 0.04); }
        .pill-con { color: #e59866; border: 1px solid rgba(229, 152, 102, 0.25); background: rgba(229, 152, 102, 0.04); }

        /* Sidebar Panels */
        .sidebar-panel { flex: 1; background: rgba(4, 15, 25, 0.75); border: 1px solid rgba(86, 239, 170, 0.12); border-radius: 12px; padding: 18px; height: fit-content; }
        .sidebar-panel h3 { font-family: 'MulticraftCustom', monospace, sans-serif; color: #e67e22; font-size: 0.8rem; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 10px; margin: 0 0 10px 0; text-align: center; }
        .points-legend-list { list-style: none; padding: 0; margin: 0; }
        .points-legend-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 0.82rem; }
        .points-legend-item span.tier-id-tag { font-family: 'MulticraftCustom', monospace, sans-serif; font-size: 0.65rem; color: #56efaa; }
        .points-legend-item span.points-weight-tag { color: #e67e22; font-weight: 600; }

        /* Floating Invite Code Box */
        .invite-badge-box {
            background: rgba(4, 15, 25, 0.9); border: 1.5px dashed #56efaa; border-radius: 8px; padding: 10px 14px;
            text-align: center; box-shadow: 0 0 15px rgba(86, 239, 170, 0.15); margin-bottom: 15px; width: 100%; box-sizing: border-box;
        }
        .invite-title { font-family: 'MulticraftCustom', monospace, sans-serif; font-size: 0.6rem; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; margin-bottom: 4px; }
        .invite-string { font-family: 'MulticraftCustom', monospace, sans-serif; font-size: 0.9rem; color: #56efaa; letter-spacing: 0.5px; }

        /* 3D Podium Placements Displays */
        .podium-arena-wrapper { display: flex; justify-content: center; align-items: flex-end; gap: 15px; margin: 15px 0 35px 0; width: 100%; }
        .podium-pedestal-node { background: rgba(5, 14, 23, 0.8); border: 2px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; position: relative; box-sizing: border-box; width: 100%; }
        .podium-pedestal-node.first-place { border-color: #ffd700; order: 2; max-width: 155px; height: 165px; }
        .podium-pedestal-node.second-place { border-color: #c0c0c0; order: 1; max-width: 145px; height: 140px; }
        .podium-pedestal-node.third-place { border-color: #cd7f32; order: 3; max-width: 145px; height: 125px; }
        .podium-placement-badge { font-family: 'MulticraftCustom', monospace, sans-serif; font-size: 1.5rem; margin-top: auto; width: 100%; text-align: center; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 5px; }
        .first-place .podium-placement-badge { color: #ffd700; }
        .second-place .podium-placement-badge { color: #c0c0c0; }
        .third-place .podium-placement-badge { color: #cd7f32; }

        /* 5-Column Grid Matrix Boards Layout */
        .tier-board-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
        .tier-column-stack { display: flex; flex-direction: column; gap: 8px; background: rgba(3, 10, 16, 0.4); padding: 10px 8px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.03); min-height: 200px; }
        .column-header-node { font-family: 'MulticraftCustom', monospace, sans-serif; font-size: 0.75rem; color: #56efaa; text-align: center; margin-bottom: 4px; border-bottom: 1px solid rgba(86, 239, 170, 0.12); padding-bottom: 6px; text-transform: uppercase; }

        /* Profile Modal Canvas */
        .profile-view-box { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 6, 10, 0.85); backdrop-filter: blur(12px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .profile-view-box.active-modal { display: flex; }
        .premium-profile-card { display: flex; flex-direction: row; width: 100%; max-width: 700px; background: #030e16; border: 1px solid #1c2d3a; border-radius: 12px; padding: 25px; box-sizing: border-box; position: relative; }
        .close-x-trigger { position: absolute; top: 15px; right: 20px; background: rgba(255, 255, 255, 0.03); color: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 900px) { .dashboard-layout-wrapper { flex-direction: column; } .tier-board-matrix { grid-template-columns: 1fr; } }
    </style>
</head>

    <script>

        const globalCompetitiveDatabase = {

            "Herobrine": { name: "Herobrine", points: 80, region: "NA", device: "Controller", rankTitle: "Combat Specialist", rankNum: 4, emerald:"HT4", dragonhide:"LT3", dragonhidekb:"HT4", diamond:"TBD", emeraldkb:"TBD" },
            "vort3xYT": { name: "vort3xYT", points: 75, region: "EU", device: "PC", rankTitle: "Combat Specialist", rankNum: 5, emerald:"TBD", dragonhide:"HT2", dragonhidekb:"TBD", diamond:"TBD", emeraldkb:"TBD" },
            "Server_pvp": { name: "Server_pvp", points: 71, region: "NA", device: "Mobile", rankTitle: "Combat Specialist", rankNum: 6, emerald:"LT4", dragonhide:"LT4", dragonhidekb:"HT5", diamond:"HT4", emeraldkb:"HT5" },

            "aaa666": { name: "aaa666", points: 15, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 9, emerald:"LT5", dragonhide:"LT5", dragonhidekb:"LT5", diamond:"LT5", emeraldkb:"LT5" },
            "Benjamin": { name: "Benjamin", points: 15, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 10, emerald:"LT5", dragonhide:"LT5", dragonhidekb:"LT5", diamond:"LT5", emeraldkb:"LT5" },
            "Booky": { name: "Booky", points: 15, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 11, emerald:"LT5", dragonhide:"LT5", dragonhidekb:"LT5", diamond:"LT5", emeraldkb:"LT5" },
            "Taxbird": { name: "Taxbird", points: 15, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 12, emerald:"LT5", dragonhide:"LT5", dragonhidekb:"LT5", diamond:"LT5", emeraldkb:"LT5" },
            "Halo117": { name: "Halo117", points: 12, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 13, emerald:"LT5", dragonhide:"LT5", dragonhidekb:"LT5", diamond:"LT5", emeraldkb:"TBD" },
            "Marwan": { name: "Marwan", points: 9, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 14, emerald:"LT5", dragonhide:"LT5", dragonhidekb:"TBD", diamond:"TBD", emeraldkb:"LT5" },
            "New_guy": { name: "New_guy", points: 9, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 15, emerald:"LT5", dragonhide:"LT5", dragonhidekb:"LT5", diamond:"TBD", emeraldkb:"TBD" },
            "grant": { name: "grant", points: 9, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 16, emerald:"LT5", dragonhide:"LT5", dragonhidekb:"LT5", diamond:"TBD", emeraldkb:"TBD" },
            "LATAMM": { name: "LATAMM", points: 9, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 17, emerald:"LT5", dragonhide:"TBD", dragonhidekb:"LT5", diamond:"LT5", emeraldkb:"TBD" },
            "COCO-_": { name: "COCO-_", points: 8, region: "NA", device: "Mobile", rankTitle: "Rookie", rankNum: 18, emerald:"HT5", dragonhide:"TBD", dragonhidekb:"TBD", diamond:"TBD", emeraldkb:"TBD" },
            "Hamude_VIP": { name: "Hamude_VIP", points: 8, region: "NA", device: "PC", rankTitle: "Rookie", rankNum: 19, emerald:"HT5", dragonhide:"LT5", dragonhidekb:"TBD", diamond:"TBD", emeraldkb:"TBD" }
        };

        const kitColumnMap = {
            "emerald": "emerald",
            "emerald kb": "emeraldkb",
            "dragonhide": "dragonhide",
            "dragonhide kb": "dragonhidekb",
            "diamond": "diamond"
        };
        // Navigation Switcher Engine - Handles View Layout Swapping
        function toggleLeaderboardScreen(targetViewId, controlButton) {
            const cleanTarget = targetViewId.toLowerCase().trim();
            
            document.querySelectorAll('.nav-tab-trigger').forEach(btn => btn.classList.remove('active-trigger'));
            if (controlButton) controlButton.classList.add('active-trigger');
            
            const cardOverlay = document.getElementById('player-profile-view-container');
            if (cardOverlay) cardOverlay.classList.remove('active-modal');

            const headerNode = document.getElementById('board-display-header-title');
            const podiumSpot = document.getElementById('podium-arena-injection-spot');

            if (cleanTarget === 'overall') {
                if (headerNode) headerNode.innerText = "Overall Rankings Menu";
                if (podiumSpot) podiumSpot.innerHTML = ""; // Clear podiums on home screen
                renderOverallStandardBoard();
                return;
            }

            if (kitColumnMap[cleanTarget]) {
                const formattedTitle = controlButton ? controlButton.innerText : targetViewId;
                if (headerNode) headerNode.innerText = formattedTitle + " Board";
                
                rebuildKitBoardMatrix(kitColumnMap[cleanTarget]);
            }
        }

        // Home View Generator - Renders the standard list view matching your original design look
        function renderOverallStandardBoard() {
            const targetCell = document.getElementById('unified-matrix-injection-target');
            if (!targetCell) return;

            // Sort players strictly by overall point balances
            const sortedRoster = Object.values(globalCompetitiveDatabase).sort((a, b) => b.points - a.points);

            let htmlString = '<div style="display: flex; flex-direction: column; gap: 8px;">';
            sortedRoster.forEach((player, index) => {
                const regionPill = player.region.toLowerCase() === 'na' ? 'pill-na' : 'pill-eu';
                let devicePill = 'pill-pc';
                if (player.device.toLowerCase() === 'mobile') devicePill = 'pill-mob';
                if (player.device.toLowerCase() === 'controller') devicePill = 'pill-con';

                htmlString += '<div class="roster-card-row" onclick="setActivePlayerParam(\'' + player.name + '\')">' +
                    '<div class="row-rank-num">#' + (index + 1) + '</div>' +
                    '<div class="row-player-name">' + player.name + '</div>' +
                    '<span class="table-pill ' + regionPill + '">' + player.region + '</span>' +
                    '<span class="table-pill ' + devicePill + '">' + player.device + '</span>' +
                    '<div class="row-points-total">' + player.points + ' PTS</div>' +
                '</div>';
            });
            htmlString += '</div>';
            
            targetCell.innerHTML = htmlString;
        }

        // Live Grid Matrix Sorter Engine - Shuffles data into T1-T5 stacks dynamically
        function rebuildKitBoardMatrix(columnKey) {
            const stacks = { "T1": [], "T2": [], "T3": [], "T4": [], "T5": [] };
            let eligibleList = [];

            Object.values(globalCompetitiveDatabase).forEach(player => {
                const rawTier = player[columnKey];
                if (!rawTier || rawTier === 'TBD') return;
                
                const tierNumber = rawTier.substring(2); 
                const targetStackKey = 'T' + tierNumber;
                
                if (stacks[targetStackKey]) {
                    const regionPill = player.region.toLowerCase() === 'na' ? 'pill-na' : 'pill-eu';
                    let devicePill = 'pill-pc';
                    if (player.device.toLowerCase() === 'mobile') devicePill = 'pill-mob';
                    if (player.device.toLowerCase() === 'controller') devicePill = 'pill-con';

                    // Premium block player layout card matching your snapshot grid format
                    const layoutHtml = '<div class="mini-kit-card" onclick="setActivePlayerParam(\'' + player.name + '\')">' +
                        '<div class="mini-card-name">' + player.name + '</div>' +
                        '<div class="mini-card-row">' +
                            '<div>' +
                                '<span class="table-pill ' + regionPill + '" style="font-size:0.5rem; padding:1px 4px; margin-right:4px;">' + player.region + '</span>' +
                                '<span class="table-pill ' + devicePill + '" style="font-size:0.5rem; padding:1px 4px;">' + player.device.substring(0,3) + '</span>' +
                            '</div>' +
                            '<div class="mini-card-tier">' + rawTier + '</div>' +
                        '</div>' +
                    '</div>';
                    
                    const playerPayload = { html: layoutHtml, tier: rawTier, name: player.name };
                    stacks[targetStackKey].push(playerPayload);
                    eligibleList.push(playerPayload);
                }
            });

            // Re-order active elements matching formal weighting scales
            const globalTierWeightSystem = ["HT1", "LT1", "HT2", "LT2", "HT3", "LT3", "HT4", "LT4", "HT5", "LT5"];
            eligibleList.sort((a, b) => globalTierWeightSystem.indexOf(a.tier) - globalTierWeightSystem.indexOf(b.tier));

            // Generate Podium Structures dynamically on weapon switch
            const podiumSpot = document.getElementById('podium-arena-injection-spot');
            if (podiumSpot) {
                let p1 = { name: "Empty", tier: "-" }, p2 = { name: "Empty", tier: "-" }, p3 = { name: "Empty", tier: "-" };
                let o1 = "style='opacity:0.25;'", o2 = "style='opacity:0.25;'", o3 = "style='opacity:0.25;'";
                let s1 = "none", s2 = "none", s3 = "none";

                if (eligibleList[0]) { p1 = eligibleList[0]; o1 = "onclick=\"setActivePlayerParam('" + p1.name + "')\""; s1 = "flex"; }
                if (eligibleList[1]) { p2 = eligibleList[1]; o2 = "onclick=\"setActivePlayerParam('" + p2.name + "')\""; s2 = "flex"; }
                if (eligibleList[2]) { p3 = eligibleList[2]; o3 = "onclick=\"setActivePlayerParam('" + p3.name + "')\""; s3 = "flex"; }

                podiumSpot.innerHTML = '<div class="podium-arena-wrapper">' +
                    '<div class="podium-pedestal-node second-place" ' + o2 + '>' +
                        '<div class="rank-badge">' + p2.tier + '</div>' +
                        '<span style="font-weight:700; margin-bottom:5px; font-size:0.9rem;">' + p2.name + '</span>' +
                        '<div class="podium-skin-slot" style="display:' + s2 + ';">[Skin]</div>' +
                        '<div class="podium-placement-badge">2</div>' +
                    '</div>' +
                    '<div class="podium-pedestal-node first-place" ' + o1 + '>' +
                        '<div class="rank-badge" style="color:#ffd700; border-color:#ffd700;">' + p1.tier + '</div>' +
                        '<span style="font-weight:700; margin-bottom:5px; color:#ffd700; font-size:0.95rem;">' + p1.name + '</span>' +
                        '<div class="podium-skin-slot" style="display:' + s1 + ';">[Skin]</div>' +
                        '<div class="podium-placement-badge">1</div>' +
                    '</div>' +
                    '<div class="podium-pedestal-node third-place" ' + o3 + '>' +
                        '<div class="rank-badge" style="color:#cd7f32; border-color:#cd7f32;">' + p3.tier + '</div>' +
                        '<span style="font-weight:700; margin-bottom:5px; font-size:0.9rem;">' + p3.name + '</span>' +
                        '<div class="podium-skin-slot" style="display:' + s3 + ';">[Skin]</div>' +
                        '<div class="podium-placement-badge">3</div>' +
                    '</div>' +
                '</div>';
            }

            // Generate 5-Column Grid Matrix Boards
            const mainTargetCell = document.getElementById('unified-matrix-injection-target');
