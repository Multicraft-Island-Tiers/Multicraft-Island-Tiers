        // Tab Screen Layout Content Visibility Switcher
        function toggleLeaderboardScreen(targetViewId, controlButton) {
            const cleanTarget = targetViewId.toLowerCase().trim();
            
            document.querySelectorAll('.nav-tab-trigger').forEach(btn => btn.classList.remove('active-trigger'));
            if (controlButton) controlButton.classList.add('active-trigger');
            
            const cardOverlay = document.getElementById('player-profile-view-container');
            if (cardOverlay) cardOverlay.classList.remove('active-modal');

            if (cleanTarget === 'overall') {
                document.getElementById('view-layer-emerald').style.display = 'none';
                document.getElementById('overall-players-registry-list').style.display = 'block';
                document.getElementById('view-layer-overall').style.display = 'block';
                return;
            }

            if (kitColumnMap[cleanTarget]) {
                document.getElementById('view-layer-overall').style.display = 'none';
                document.getElementById('overall-players-registry-list').style.display = 'none';
                document.getElementById('view-layer-emerald').style.display = 'block';
                
                const formattedTitle = controlButton ? controlButton.innerText : targetViewId;
                document.querySelector('#view-layer-emerald .menu-title').innerText = formattedTitle + " Board";
                
                rebuildKitBoardMatrix(kitColumnMap[cleanTarget]);
            }
        }

        // Live engine re-shuffling profiles into T1-T5 columns instantly
        function rebuildKitBoardMatrix(columnKey) {
            const stacks = { "T1": [], "T2": [], "T3": [], "T4": [], "T5": [] };
            let topTierMatches = [];

            // Filter players who hold records for this weapon category
            Object.values(globalCompetitiveDatabase).forEach(player => {
                const rawTier = player[columnKey];
                if (!rawTier || rawTier === 'TBD') return;
                
                const tierGroup = rawTier.substring(2); 
                const targetKey = 'T' + tierGroup;
                
                if (stacks[targetKey]) {
                    const rowHtml = '<div class="roster-card-row" style="padding: 10px 14px; margin-bottom: 10px;" onclick="setActivePlayerParam(\'' + player.name + '\')">' +
                        '<div class="row-player-name" style="font-size: 0.95rem;">' + player.name + '</div>' +
                        '<div style="font-size:0.65rem; color:#ffd700; font-family:\'Press Start 2P\', monospace; margin-right: 10px;">' + rawTier + '</div>' +
                        '<span class="table-pill ' + (player.region.toLowerCase() === 'na' ? 'pill-na' : 'pill-eu') + '" style="font-size: 0.6rem; padding: 2px 6px;">' + player.region + '</span>' +
                    '</div>';
                    
                    stacks[targetKey].push({ html: rowHtml, tier: rawTier, name: player.name });
                }
            });

            // Flatten list and sort strictly using official platform weights (HT1 down to LT5)
            const tierOrder = ["HT1", "LT1", "HT2", "LT2", "HT3", "LT3", "HT4", "LT4", "HT5", "LT5"];
            Object.values(stacks).forEach(list => {
                list.forEach(item => topTierMatches.push(item));
            });
            topTierMatches.sort((a, b) => tierOrder.indexOf(a.tier) - tierOrder.indexOf(b.tier));

            // Safely write content down into page matrix structural cells
            for (let i = 1; i <= 5; i++) {
                const colNode = document.querySelectorAll('.tier-column-stack')[i - 1];
                const targetCell = colNode ? colNode.querySelector('.column-injection-cell') : null;
                if (!targetCell) continue;
                
                const items = stacks['T' + i];
                if (items.length === 0) {
                    targetCell.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.15); font-size: 0.75rem; padding: 15px 0;">No Active Players</div>';
                } else {
                    targetCell.innerHTML = items.map(item => item.html).join('');
                }
            }

            // Sync 3D Podiums with active weapon leaderboard results
            const placements = [
                { class: '.first-place', rank: 0 },
                { class: '.second-place', rank: 1 },
                { class: '.third-place', rank: 2 }
            ];

            placements.forEach(p => {
                const node = document.querySelector('.podium-pedestal-node' + p.class);
                if (!node) return;
                
                if (topTierMatches[p.rank]) {
                    const match = topTierMatches[p.rank];
                    node.style.opacity = '1';
                    node.setAttribute('onclick', "setActivePlayerParam('" + match.name + "')");
                    node.querySelector('.rank-badge').innerText = match.tier;
                    node.querySelector('span').innerText = match.name;
                    node.querySelector('[style*="dashed"]').style.display = 'flex';
                } else {
                    node.style.opacity = '0.3';
                    node.setAttribute('onclick', '');
                    node.querySelector('.rank-badge').innerText = '-';
                    node.querySelector('span').innerText = 'Empty';
                    node.querySelector('[style*="dashed"]').style.display = 'none';
                }
