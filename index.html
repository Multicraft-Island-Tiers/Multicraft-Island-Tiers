<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Leaderboard</title>
    <style>
        /* Unbreakable, standard system font layout */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background: radial-gradient(circle at center, #0e2430 0%, #050d12 100%);
            overflow-x: hidden; 
        }
        
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 30px; 
            text-align: center; 
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 12px; 
            border: 1px solid rgba(100, 243, 229, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }
        
        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1150px;
        }
        
        .main-content-panel { 
            flex: 3;
            background: rgba(0, 0, 0, 0.45); 
            border: 2px solid #ffffff; 
            border-radius: 16px; 
            padding: 25px; 
            box-sizing: border-box; 
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: block;
        }
        
        .main-content-panel h2, .sidebar-panel h3 { 
            margin-top: 0; 
            color: #64f3e5; 
            font-size: 1.75rem;
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 12px; 
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.3);
        }
        
        .sidebar-panel {
            flex: 1;
            background: rgba(14, 39, 53, 0.8);
            border: 2px solid #64f3e5;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            height: fit-content;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .sidebar-panel h3 {
            color: #e67e22;
        }
        
        /* Premium horizontal rows custom architecture layout */
        .roster-card-row {
            display: flex;
            align-items: center;
            background: rgba(10, 22, 31, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 14px 20px;
            margin-bottom: 10px;
            box-sizing: border-box;
            gap: 15px;
        }
        
        .row-rank-num {
            font-size: 1.1rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.4);
            width: 45px;
            text-align: center;
        }
        .roster-card-row:nth-child(2) .row-rank-num { color: #ffd700; }
        .roster-card-row:nth-child(3) .row-rank-num { color: #c0c0c0; }
        .roster-card-row:nth-child(4) .row-rank-num { color: #cd7f32; }

        .row-player-name {
            font-size: 1.15rem;
            font-weight: bold;
            color: #64f3e5;
            flex: 1;
        }
        
        /* Micro Pill Badges for Table Rows */
        .table-pill {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .pill-na { color: #5dade2; border: 1px solid #5dade2; background: rgba(93, 189, 226, 0.05); }
        .pill-eu { color: #f4d03f; border: 1px solid #f4d03f; background: rgba(244, 208, 63, 0.05); }
        .pill-pc { color: #af7ac5; border: 1px solid #af7ac5; background: rgba(175, 122, 197, 0.05); }
        .pill-mob { color: #52be80; border: 1px solid #52be80; background: rgba(82, 190, 128, 0.05); }
        .pill-con { color: #e59866; border: 1px solid #e59866; background: rgba(229, 152, 102, 0.05); }
        
        /* Row mini kit grids container spacing settings */
        .row-kits-summary-strip {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .row-mini-kit-tag {
            font-size: 0.7rem;
            font-weight: 800;
            color: #0b1d28;
            background: #64f3e5;
            padding: 3px 7px;
            border-radius: 4px;
            border: 1px solid #ffffff;
        }
        .row-mini-kit-tag.tbd-tag {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.2);
        }

        .row-points-total {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffd700;
            min-width: 90px;
            text-align: right;
        }
        
        .points-legend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .points-legend-item {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        .points-legend-item:last-child {
            border-bottom: none;
        }
        .points-legend-item span.tier-id-tag {
            font-weight: bold;
            color: #64f3e5;
        }
        .points-legend-item span.points-weight-tag {
            color: #e67e22;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .dashboard-layout-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .sidebar-panel {
                width: 100%;
            }
            .row-kits-summary-strip {
                display: none;
            }
        }
    </style>
</head>
<body>
