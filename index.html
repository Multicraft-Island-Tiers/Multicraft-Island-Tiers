<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Leaderboard</title>
    <style>
        /* Base page layout - Dark outer space gaming atmosphere */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background: radial-gradient(circle at center, #0e2430 0%, #050d12 100%);
            overflow-x: hidden; 
        }
        
        /* Structural containers */
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 30px; 
            text-align: center; 
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 12px; 
            border: 1px solid rgba(100, 243, 229, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }
        
        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1150px;
            margin-bottom: 40px;
        }
        
        .main-content-panel { 
            flex: 3;
            background: rgba(0, 0, 0, 0.45); 
            border: 2px solid #ffffff; 
            border-radius: 16px; 
            padding: 25px; 
            box-sizing: border-box; 
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        
        .main-content-panel h2, .sidebar-panel h3, .archive-heading { 
            margin-top: 0; 
            color: #64f3e5; 
            font-size: 1.75rem;
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 12px; 
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.3);
        }
        
        .sidebar-panel {
            flex: 1;
            background: rgba(14, 39, 53, 0.8);
            border: 2px solid #64f3e5;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            height: fit-content;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .sidebar-panel h3 {
            color: #e67e22;
        }
        
        /* Unbreakable Native Table Styles */
        .leaderboard-table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        .leaderboard-table th, .leaderboard-table td { 
            padding: 16px 14px; 
            border: 1px solid #ffffff; 
            text-align: left; 
        }
        .leaderboard-table th { 
            background-color: rgba(43, 122, 113, 0.9); 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .leaderboard-table tbody tr {
            transition: background-color 0.2s;
        }
        .leaderboard-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .player-table-name { 
            color: #64f3e5; 
            font-weight: bold; 
            font-size: 1.1rem; 
        }
        
        /* Micro Pill Badges for Table Rows */
        .table-pill {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-right: 5px;
            display: inline-block;
        }
        .pill-na { color: #5dade2; border: 1px solid #5dade2; }
        .pill-eu { color: #f4d03f; border: 1px solid #f4d03f; }
        .pill-pc { color: #af7ac5; border: 1px solid #af7ac5; }
        .pill-mob { color: #52be80; border: 1px solid #52be80; }
        .pill-con { color: #e59866; border: 1px solid #e59866; }
        
        /* Premium Split-Column Profile Display Cards */
        .archive-heading {
            width: 100%;
            max-width: 1150px;
            color: #e67e22;
            text-align: left;
            margin-top: 20px;
        }
        
        .premium-profile-card {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1150px;
            background: #06131c;
            border: 2px solid rgba(100, 243, 229, 0.3);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            margin-bottom: 25px;
        }
        
        /* Left Column Structure */
        .card-left-column {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            background: linear-gradient(135deg, rgba(14, 36, 48, 0.4) 0%, rgba(5, 13, 18, 0.4) 100%);
        }
        .rank-badge {
            font-weight: 700;
            font-size: 0.8rem;
            color: #ffd700;
            border: 1.5px solid #ffd700;
            padding: 4px 12px;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .card-player-title {
            font-size: 2rem;
            color: #ffffff;
            margin: 0 0 15px 0;
            word-break: break-all;
        }
        .tags-row {
            display: flex;
            gap: 8px;
            margin-bottom: auto;
        }
        .card-meta-pill {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .score-display-node {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd700;
            margin-top: 25px;
        }
        .score-display-node span {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 6px;
            font-weight: 400;
        }
        
        /* Right Column Structure */
        .card-right-column {
            flex: 1.5;
            padding: 30px;
            box-sizing: border-box;
        }
        .right-column-header {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            margin: 0 0 25px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }
        .kits-display-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px;
        }
        .kit-slot-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .circle-frame {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #64f3e5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.02);
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(100, 243, 229, 0.15);
        }
        .circle-frame.empty-frame {
            border-color: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }
        .kit-slot-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .points-legend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .points-legend-item {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        .points-legend-item:last-child {
            border-bottom: none;
        }
        .points-legend-item span.tier-id-tag {
            font-weight: bold;
            color: #64f3e5;
        }
        .points-legend-item span.points-weight-tag {
            color: #e67e22;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .dashboard-layout-wrapper, .premium-profile-card {
                flex-direction: column;
                align-items: center;
            }
            .sidebar-panel, .card-left-column {
                width: 100%;
            }
            .card-left-column {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>
<body>
    <div class="logo-container"><img src="logo.png" alt="Multicraft Island Tiers Banner"></div>
    
    <div class="dashboard-layout-wrapper">
        <!-- Main Board Panel -->
        <div class="main-content-panel">
            <h2>Overall Leaderboard Rankings</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Region</th>
                        <th>Device</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>#1</td><td><span class="player-table-name">Husky_Multicraft</span></td><td><span class="table-pill pill-na">NA</span></td><td><span class="table-pill pill-pc">PC</span></td><td><strong>180</strong></td></tr>
