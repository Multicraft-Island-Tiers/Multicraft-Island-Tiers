<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multicraft Tier List</title>
  <style>
    :root {
      --page-bg-1: #051b27;
      --page-bg-2: #0a1229;
      --nav-bg: rgba(7, 12, 17, 0.84);
      --panel-bg: rgba(5, 14, 20, 0.74);
      --panel-border: rgba(80, 220, 255, 0.7);
      --strong-border: rgba(90, 240, 255, 0.9);
      --gold: #f6d451;
      --gold-2: #ffd75c;
      --cyan: #7ceaf8;
      --cyan-2: #7ef1e1;
      --pink: #ff8ec5;
      --purple: #b784ff;
      --green: #77efb4;
      --orange: #ffbc57;
      --text: #ebf7ff;
      --soft: rgba(255,255,255,0.6);
      --dark: rgba(1, 8, 12, 0.9);
      --tier-blue: #7df0ff;
      --tier-green: #8df4b3;
      --tier-purple: #ba9af7;
      --tier-orange: #ffbf73;
      --shadow: 0 0 10px rgba(96, 224, 255, 0.2);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(90deg, rgba(7, 29, 36, 0.9), rgba(16, 10, 22, 0.92));
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 20% 25%, rgba(60, 163, 185, 0.5), transparent 20%),
        radial-gradient(circle at 80% 15%, rgba(158, 87, 168, 0.42), transparent 28%),
        linear-gradient(90deg, #031c25 0%, #0c1b2d 40%, #140d21 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 15%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(2px 2px at 28% 30%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(1.5px 1.5px at 42% 18%, rgba(255,255,255,0.9), transparent 35%),
        radial-gradient(2px 2px at 58% 25%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(2px 2px at 72% 18%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(1.75px 1.75px at 90% 26%, rgba(255,255,255,0.9), transparent 35%),
        radial-gradient(2px 2px at 18% 73%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(1.5px 1.5px at 34% 60%, rgba(255,255,255,0.9), transparent 35%),
        radial-gradient(2px 2px at 52% 70%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(1.5px 1.5px at 68% 62%, rgba(255,255,255,0.9), transparent 35%),
        radial-gradient(2px 2px at 78% 78%, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(2px 2px at 92% 66%, rgba(255,255,255,0.9), transparent 40%);
      opacity: 0.9;
      pointer-events: none;
      z-index: 0;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.35; }
      100% { opacity: 0.95; }
    }

    .page-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 0 0 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      background: rgba(7, 10, 17, 0.78);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 18px;
      position: relative;
      z-index: 3;
    }

    .brand {
      flex: 0 0 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand img {
      display: block;
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .main-links {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1.4px;
      font-weight: 700;
      color: rgba(255,255,255,0.82);
    }

    .main-links a {
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      opacity: 0.9;
    }

    .main-links a:hover,
    .main-links a.active {
      color: var(--cyan);
    }

    .search-wrap {
      flex: 0 0 240px;
      display: flex;
      justify-content: flex-end;
    }

    .search-box {
      width: min(22vw, 220px);
      min-width: 150px;
      height: 30px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.78);
      border-radius: 4px;
      padding: 0 10px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      outline: none;
    }

    .search-box::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 0 10px;
      margin-top: 14px;
    }

    .kit-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(5, 15, 20, 0.28);
      color: rgba(255,255,255,0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 30px;
      min-width: 90px;
      padding: 0 10px;
      border-radius: 4px;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .kit-btn img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
    }

    .kit-btn:hover,
    .kit-btn.active {
      color: var(--gold);
      border-color: rgba(255, 214, 71, 0.8);
      box-shadow: 0 0 10px rgba(255, 220, 70, 0.18);
    }

    .board-shell {
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 0 18px;
    }

    .leaderboard-title {
      text-align: center;
      color: var(--cyan);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 800;
      margin: 10px 0 14px;
      text-shadow: 0 0 10px rgba(124, 234, 248, 0.38);
    }

    .tier-board {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 0 8px 18px;
    }

    .top-players {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 18px;
      justify-content: center;
      max-width: 620px;
      margin: 0 auto;
      width: 100%;
    }

    .top-player-card {
      position: relative;
      background: rgba(4, 12, 18, 0.75);
      border: 1px solid rgba(112, 219, 255, 0.16);
      border-radius: 8px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 8px 8px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .top-player-card:hover {
      transform: translateY(-2px);
      border-color: rgba(128, 238, 255, 0.4);
    }

    .top-player-card .award-rank {
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 17, 25, 0.95);
      border: 1px solid rgba(255, 214, 70, 0.7);
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 1px;
      border-radius: 5px;
      padding: 2px 8px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .top-player-card .mini-head {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin-top: 18px;
      background: linear-gradient(180deg, #76e5cc, #3ab79f);
      border: 2px solid rgba(0,0,0,0.45);
      position: relative;
      box-shadow: 0 0 10px rgba(97, 221, 255, 0.1);
    }

    .top-player-card .mini-head::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 8px;
      width: 11px;
      height: 11px;
      background: rgba(30, 24, 21, 0.8);
      border-radius: 50%;
      box-shadow: 17px 0 rgba(30,24,21,0.8);
    }

    .top-player-card .mini-head::after {
      content: "";
      position: absolute;
      left: 10px;
      bottom: 9px;
      width: 28px;
      height: 12px;
      background: rgba(6, 14, 15, 0.18);
      border-radius: 8px;
    }

    .top-player-card .mini-name {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-player-card .mini-tier {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      width: 100%;
      flex-wrap: wrap;
    }

    .mini-tier .little-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(255, 212, 82, 0.8);
      background: rgba(13, 19, 23, 0.8);
      color: var(--gold);
      font-size: 8px;
      letter-spacing: 0.8px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0 8px;
    }

    .tier-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px 14px;
      margin-top: 6px;
    }

    .tier-block {
      padding: 0 0 10px;
      min-height: 70px;
    }

    .tier-label {
      display: block;
      color: rgba(126, 234, 255, 0.82);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
      padding-left: 2px;
      font-weight: 800;
    }

    .player-slot {
      position: relative;
      min-height: 82px;
      background: rgba(6, 12, 18, 0.7);
      border: 1px solid rgba(102, 143, 175, 0.22);
      border-radius: 6px;
      padding: 10px 8px 8px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .player-slot:hover {
      transform: translateY(-1px);
      border-color: rgba(122, 236, 255, 0.42);
    }

    .player-slot .mini-card-head {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(180deg, #7ce0c9 0%, #49ab96 100%);
      border: 2px solid rgba(0,0,0,0.5);
      position: relative;
      display: none;
    }

    .player-slot .mini-card-head::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 5px;
      width: 5px;
      height: 5px;
      background: rgba(22,22,22,0.88);
      border-radius: 50%;
      box-shadow: 9px 0 rgba(22,22,22,0.88);
    }

    .player-slot .mini-card-head::after {
      content: "";
      position: absolute;
      left: 6px;
      bottom: 4px;
      width: 14px;
      height: 6px;
      background: rgba(16, 22, 25, 0.18);
      border-radius: 8px;
    }

    .player-slot .slot-name {
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      color: #edf8ff;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-slot .slot-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 16px;
    }

    .slot-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 8px;
      letter-spacing: 0.6px;
      font-weight: 800;
      text-transform: uppercase;
      border: 1px solid rgba(118, 222, 255, 0.4);
      background: rgba(10, 16, 22, 0.8);
      color: var(--cyan);
    }

    .slot-tag.na { border-color: rgba(95, 208, 255, 0.6); color: #8fe5ff; }
    .slot-tag.eu { border-color: rgba(255, 216, 74, 0.7); color: #f7db7a; }
    .slot-tag.pc { border-color: rgba(178, 132, 255, 0.7); color: #d4b3ff; }
    .slot-tag.mob { border-color: rgba(110, 245, 180, 0.7); color: #9ef2c6; }
    .slot-tag.con { border-color: rgba(255, 168, 99, 0.7); color: #ffc892; }

    .slot-tag.t1 { border-color: rgba(126, 234, 255, 0.7); color: #7fe8ff; }
    .slot-tag.t2 { border-color: rgba(117, 240, 179, 0.7); color: #9bf5c1; }
    .slot-tag.t3 { border-color: rgba(185, 132, 255, 0.8); color: #d0b2ff; }
    .slot-tag.t4 { border-color: rgba(255, 175, 92, 0.8); color: #ffc375; }
    .slot-tag.t5 { border-color: rgba(255, 117, 117, 0.8); color: #ffb0b0; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .player-modal {
      width: min(86vw, 760px);
      min-height: 360px;
      background: rgba(4, 12, 17, 0.97);
      border: 2px solid rgba(108, 229, 255, 0.8);
      border-radius: 12px;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      box-shadow: 0 0 0 2px rgba(96, 228, 255, 0.24), 0 0 18px rgba(96, 228, 255, 0.18);
      overflow: hidden;
      position: relative;
    }

    .modal-left {
      padding: 16px 14px 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 320px;
    }

    .modal-info-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .rank-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 76px;
      height: 24px;
      border-radius: 14px;
      background: rgba(10, 16, 21, 0.9);
      border: 1px solid rgba(255, 214, 70, 0.7);
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 8px;
    }

    .modal-player-name {
      font-size: clamp(2.2rem, 4vw, 3.5rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 14px 0 10px;
      color: rgba(255,255,255,0.96);
      text-transform: lowercase;
    }

    .modal-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 24px;
      border-radius: 5px;
      background: rgba(9, 16, 20, 0.9);
      border: 1px solid rgba(95, 204, 255, 0.7);
      color: var(--cyan);
      font-size: 9px;
      letter-spacing: 0.8px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0 8px;
    }

    .mini-pill.na { border-color: rgba(103, 217, 255, 0.8); color: #99ebff; }
    .mini-pill.eu { border-color: rgba(255, 217, 86, 0.8); color: #ffeb8a; }
    .mini-pill.pc { border-color: rgba(178, 132, 255, 0.8); color: #d7b6ff; }
    .mini-pill.mob { border-color: rgba(125, 235, 182, 0.8); color: #a8f7cf; }
    .mini-pill.con { border-color: rgba(255, 172, 104, 0.8); color: #ffc687; }

    .modal-spacer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
    }

    .modal-avatar {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      background: rgba(110, 224, 255, 0.06);
      border: 2px solid rgba(110, 224, 255, 0.12);
      display: none;
    }

    .modal-total {
      color: var(--gold);
      font-size: clamp(2.1rem, 3vw, 3rem);
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-total::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(255, 216, 84, 0.8);
      display: inline-block;
    }

    .modal-right {
      position: relative;
      padding: 18px 16px 18px 14px;
      background: rgba(0,0,0,0.12);
      border-left: 1px solid rgba(255,255,255,0.05);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-title {
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      font-size: 10px;
      letter-spacing: 1.6px;
      font-weight: 800;
    }

    .close-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(12, 20, 26, 0.85);
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kit-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(60px, 1fr));
      gap: 10px 12px;
      align-items: start;
      justify-items: center;
      max-height: 240px;
      overflow: hidden;
    }

    .kit-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255, 214, 70, 0.85);
      background: rgba(9, 16, 21, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 0 10px rgba(255,210,80,0.12);
    }

    .kit-circle img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
    }

    .kit-circle span {
      font-size: 8px;
      letter-spacing: 0.8px;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 800;
    }

    .modal-qmark {
      position: absolute;
      right: 12px;
      bottom: 10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(9, 17, 21, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.72);
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .topbar {
        flex-wrap: wrap;
        height: auto;
        padding: 12px 14px;
        gap: 10px;
      }

      .brand, .search-wrap {
        flex: 1 1 100%;
        justify-content: center;
      }

      .main-links {
        width: 100%;
        flex-wrap: wrap;
      }

      .top-players {
        grid-template-columns: 1fr;
        max-width: 350px;
      }

      .tier-grid {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }

      .player-modal {
        grid-template-columns: 1fr;
      }

      .modal-right {
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.08);
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" alt="Multicraft logo">
      </div>

      <nav class="main-links" aria-label="Main navigation">
        <a href="#" class="active">Home</a>
      </nav>

      <div class="search-wrap">
        <input class="search-box" type="text" placeholder="Search Player..." aria-label="Search player">
      </div>
    </header>

    <div class="filter-bar" id="filter-bar">
      <button class="kit-btn active" data-kit="all" type="button"><img src="overall.png" alt="Overall">Overall</button>
      <button class="kit-btn" data-kit="emerald" type="button"><img src="Emerald.png" alt="Emerald">Emerald</button>
      <button class="kit-btn" data-kit="emerald-kb" type="button"><img src="Emerald_KB.png" alt="Emerald KB">Emerald KB</button>
      <button class="kit-btn" data-kit="dragonhide-kb" type="button"><img src="Dragonhide_KB.png" alt="Dragonhide KB">Dragonhide KB</button>
      <button class="kit-btn" data-kit="dragonhide" type="button"><img src="Dragonhide.png" alt="Dragonhide">Dragonhide</button>
      <button class="kit-btn" data-kit="diamond" type="button"><img src="Diamond.png" alt="Diamond">Diamond</button>
    </div>

    <div class="board-shell">
      <div class="leaderboard-title" id="leaderboard-title">Overall Leaderboard</div>
      <div id="board-root" class="tier-board"></div>
    </div>
  </div>

  <div id="player-modal" class="modal-backdrop" aria-hidden="true">
    <div class="player-modal" role="dialog" aria-modal="true" aria-labelledby="modal-player-name">
      <div class="modal-left">
        <div class="modal-info-strip">
          <span id="modal-rank" class="rank-chip">RANK #3</span>
        </div>

        <div>
          <div id="modal-player-name" class="modal-player-name">sample</div>
          <div id="modal-pills" class="modal-pills"></div>
        </div>

        <div class="modal-spacer">
          <div class="modal-avatar"></div>
        </div>

        <div id="modal-total" class="modal-total">240 PTS</div>
      </div>

      <div class="modal-right">
        <div class="modal-header">
          <div class="modal-title">Kit Rankings</div>
          <button id="close-modal" class="close-btn" aria-label="Close">×</button>
        </div>

        <div id="kit-grid" class="kit-grid"></div>
        <div class="modal-qmark">?</div>
      </div>
    </div>
  </div>

  <script>
    const allTierKeys = ['HT1', 'LT1', 'HT2', 'LT2', 'HT3', 'LT3', 'HT4', 'LT4', 'HT5', 'LT5'];
    const tierRankMap = { HT1: 1, LT1: 2, HT2: 3, LT2: 4, HT3: 5, LT3: 6, HT4: 7, LT4: 8, HT5: 9, LT5: 10 };

    const kitAssets = {
      emerald: 'Emerald.png',
      'emerald-kb': 'Emerald_KB.png',
      dragonhide: 'Dragonhide.png',
      'dragonhide-kb': 'Dragonhide_KB.png',
      diamond: 'Diamond.png'
    };

    let currentKitFilter = 'all';
    let allPlayers = [];
    let filteredPlayers = [];

    function normalizeKit(value) {
      return String(value || '').trim().toLowerCase().replace(/\s+/g, '-');
    }

    function getAssetForKit(kitName) {
      const slug = normalizeKit(kitName);
      return kitAssets[slug] || 'logo.png';
    }

    function getRegionClass(region) {
      const key = String(region || '').toUpperCase();
      if (key === 'NA') return 'na';
      if (key === 'EU') return 'eu';
      if (key === 'PC') return 'pc';
      if (key === 'MOB') return 'mob';
      if (key === 'CTRL') return 'con';
      return 'na';
    }

    function getTierBoxClass(tier) {
      const val = String(tier || 'LT5').toUpperCase();
      if (['HT1', 'HT2', 'HT4', 'HT5'].includes(val)) return 'green-border';
      if (['LT1', 'LT2', 'LT4'].includes(val)) return 'cyan-border';
      if (['HT3', 'LT3'].includes(val)) return 'purple-border';
      return 'orange-border';
    }

    function playerTierScore(player) {
      const matches = Array.isArray(player.achievements) ? player.achievements : [];
      if (currentKitFilter === 'all') return Number(player.totalPoints || 0);
      const active = matches.filter(item => normalizeKit(item.kit) === currentKitFilter);
      if (!active.length) return 0;
      const best = active.reduce((best, item) => {
        const score = Number(pointMatrix[item.tier] || 0);
        return Math.max(best, score);
      }, 0);
      return best;
    }

    function getPlayersForBoard() {
      const players = [...allPlayers];
      const filtered = currentKitFilter === 'all'
        ? players
        : players.filter(player => {
            const kits = (player.achievements || []).map(a => normalizeKit(a.kit));
            return kits.includes(currentKitFilter);
          });

      filtered.sort((a, b) => {
        const scoreA = playerTierScore(a);
        const scoreB = playerTierScore(b);
        if (scoreB !== scoreA) return scoreB - scoreA;
        const overallA = Number(a.totalPoints || 0);
        const overallB = Number(b.totalPoints || 0);
        if (overallB !== overallA) return overallB - overallA;
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      return filtered.slice(0, 15);
    }

    function buildTopPlayers(players) {
      const top = players.slice(0, 3);
      return `
        <div class="top-players">
          ${top.map((player, index) => {
            const tierNames = (player.achievements || []).slice(0, 3).map(item => item.tier).join(' ');
            return `
              <div class="top-player-card" data-player-name="${escapeHtml(player.name || '')}" data-rank="${index + 1}">
                <span class="award-rank">#${index + 1}</span>
                <div class="mini-head"></div>
                <div class="mini-name">${escapeHtml(player.name || '')}</div>
                <div class="mini-tier">
                  ${(player.achievements || []).slice(0, 3).map(item => `<span class="little-pill">${item.tier}</span>`).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function getTierGroup(players, tier) {
      const list = players.filter(player => {
        const kitMatch = (player.achievements || []).some(item => item.tier === tier);
        return kitMatch;
      });

      if (!list.length) return '';

      return `
        <div class="tier-block">
          <span class="tier-label">${tier}</span>
          <div class="tier-card-list">
            ${list.slice(0, 6).map(player => {
              const tags = (player.regions || []).slice(0, 2).map(region => `<span class="slot-tag ${getRegionClass(region)}">${region}</span>`).join('');
              const platformTags = (player.platforms || []).slice(0, 2).map(platform => `<span class="slot-tag ${getRegionClass(platform)}">${platform}</span>`).join('');
              const activeTier = (player.achievements || []).find(item => item.tier === tier);
              return `
                <div class="player-slot" data-player-name="${escapeHtml(player.name || '')}">
                  <div class="mini-card-head"></div>
                  <div class="slot-name">${escapeHtml(player.name || '')}</div>
                  <div class="slot-meta">${tags || ''}${platformTags || ''}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderBoard() {
      const root = document.getElementById('board-root');
      const players = getPlayersForBoard();
      if (!players.length) {
        root.innerHTML = '<div class="no-results">No players found.</div>';
        return;
      }

      root.innerHTML = `
        ${currentKitFilter === 'all' ? '' : buildTopPlayers(players)}
        <div class="tier-grid">
          ${allTierKeys.map(tier => getTierGroup(players, tier)).join('')}
        </div>
      `;

      wireBoardClicks();
    }

    function wireBoardClicks() {
      document.querySelectorAll('[data-player-name]').forEach(node => {
        node.addEventListener('click', () => {
          const name = node.getAttribute('data-player-name');
          const found = allPlayers.find(player => String(player.name).toLowerCase() === String(name).toLowerCase());
          if (!found) return;
          const rankIndex = getPlayersForBoard().findIndex(player => String(player.name).toLowerCase() === String(found.name).toLowerCase());
          openPlayerModal(found, rankIndex >= 0 ? rankIndex + 1 : 1);
        });
      });
    }

    function openPlayerModal(player, rank) {
      const modal = document.getElementById('player-modal');
      document.getElementById('modal-rank').textContent = 'RANK #' + rank;
      document.getElementById('modal-player-name').textContent = player.name || 'Unknown';
      document.getElementById('modal-total').textContent = `${player.totalPoints || 0} PTS`;

      const pills = document.getElementById('modal-pills');
      pills.innerHTML = '';
      const regionTags = (player.regions || []).map(region => {
        const pill = document.createElement('span');
        pill.className = `mini-pill ${getRegionClass(region)}`;
        pill.textContent = region;
        return pill;
      });
      const platformTags = (player.platforms || []).map(platform => {
        const pill = document.createElement('span');
        pill.className = `mini-pill ${getRegionClass(platform)}`;
        pill.textContent = platform;
        return pill;
      });
      [...regionTags, ...platformTags].forEach(el => pills.appendChild(el));

      const grid = document.getElementById('kit-grid');
      grid.innerHTML = '';
      (player.achievements || []).forEach(entry => {
        const circle = document.createElement('div');
        circle.className = 'kit-circle';
        circle.innerHTML = `
          <img src="${getAssetForKit(entry.kit)}" alt="${entry.kit}">
          <span>${entry.tier}</span>
        `;
        grid.appendChild(circle);
      });

      modal.classList.add('visible');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closePlayerModal() {
      const modal = document.getElementById('player-modal');
      modal.classList.remove('visible');
      modal.setAttribute('aria-hidden', 'true');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function applyKitFilter(kitName) {
      currentKitFilter = kitName;
      document.querySelectorAll('.kit-btn').forEach(button => {
        button.classList.toggle('active', button.dataset.kit === kitName);
      });
      document.getElementById('leaderboard-title').textContent = kitName === 'all' ? 'Overall Leaderboard' : kitName.replace(/-/g, ' ').toUpperCase() + ' Leaderboard';
      renderBoard();
    }

    function loadPlayers() {
      fetch('players.json')
        .then(res => res.json())
        .then(data => {
          allPlayers = Array.isArray(data) ? data : [];
          renderBoard();
        })
        .catch(err => {
          console.error('Unable to load players:', err);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPlayers();

      document.querySelectorAll('.kit-btn').forEach(button => {
        button.addEventListener('click', () => {
          applyKitFilter(button.dataset.kit);
        });
      });

      document.querySelector('.search-box').addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        if (!query) {
          renderBoard();
          return;
        }

        const subset = allPlayers.filter(player => String(player.name || '').toLowerCase().includes(query));
        const ordered = subset.sort((a, b) => Number(b.totalPoints || 0) - Number(a.totalPoints || 0));
        const board = document.getElementById('board-root');
        board.innerHTML = `
          ${currentKitFilter === 'all' ? '' : buildTopPlayers(ordered)}
          <div class="tier-grid">
            ${allTierKeys.map(tier => getTierGroup(ordered, tier)).join('')}
          </div>
        `;
        wireBoardClicks();
      });

      document.getElementById('close-modal').addEventListener('click', closePlayerModal);
      document.getElementById('player-modal').addEventListener('click', (event) => {
        if (event.target === event.currentTarget) closePlayerModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePlayerModal();
      });
    });

    const pointMatrix = {
      HT1: 100,
      LT1: 85,
      HT2: 75,
      LT2: 60,
      HT3: 40,
      LT3: 30,
      HT4: 25,
      LT4: 15,
      HT5: 8,
      LT5: 3
    };
  </script>
</body>
</html>
