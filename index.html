<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Leaderboard</title>
    <style>
        /* Base page layout - Dark outer space gaming atmosphere */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background: radial-gradient(circle at center, #0e2430 0%, #050d12 100%);
            overflow-x: hidden; 
        }
        
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 30px; 
            text-align: center; 
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 12px; 
            border: 1px solid rgba(100, 243, 229, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }
        
        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1150px;
        }
        
        .main-content-panel { 
            flex: 3;
            background: rgba(0, 0, 0, 0.45); 
            border: 2px solid #ffffff; 
            border-radius: 16px; 
            padding: 25px; 
            box-sizing: border-box; 
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: none;
        }
        .main-content-panel.active-view { 
            display: block; 
        }
        
        .main-content-panel h2, .sidebar-panel h3 { 
            margin-top: 0; 
            color: #64f3e5; 
            font-size: 1.75rem;
            border-bottom: 2px solid #ffffff; 
            padding-bottom: 12px; 
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.3);
        }

        /* Search Input Styling */
        .search-container {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(14, 39, 53, 0.6);
            border: 1px solid rgba(100, 243, 229, 0.4);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
            transition: all 0.2s;
        }
        .search-input:focus {
            outline: none;
            border-color: #64f3e5;
            box-shadow: 0 0 10px rgba(100, 243, 229, 0.3);
            background: rgba(14, 39, 53, 0.9);
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .sidebar-panel {
            flex: 1;
            background: rgba(14, 39, 53, 0.8);
            border: 2px solid #64f3e5;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            height: fit-content;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .sidebar-panel h3 {
            color: #e67e22;
        }
        
        /* Unbreakable Native Table Styles */
        .leaderboard-table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        .leaderboard-table th, .leaderboard-table td { 
            padding: 16px 14px; 
            border: 1px solid #ffffff; 
            text-align: left; 
        }
        .leaderboard-table th { 
            background-color: rgba(43, 122, 113, 0.9); 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .player-link-btn { 
            background: none; 
            border: none; 
            color: #64f3e5; 
            font-weight: bold; 
            text-decoration: underline; 
            font-size: 1.1rem; 
            cursor: pointer; 
            padding: 0; 
            font-family: inherit; 
            text-align: left;
        }
        .player-link-btn:hover { 
            color: #ffffff; 
            text-shadow: 0 0 8px #64f3e5; 
        }
        
        /* Micro Pill Badges for Table Rows */
        .table-pill {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-right: 5px;
            display: inline-block;
        }
        .pill-na { color: #5dade2; border: 1px solid #5dade2; }
        .pill-eu { color: #f4d03f; border: 1px solid #f4d03f; }
        .pill-pc { color: #af7ac5; border: 1px solid #af7ac5; }
        .pill-mob { color: #52be80; border: 1px solid #52be80; }
        .pill-con { color: #e59866; border: 1px solid #e59866; }
        
        /* Premium Split-Column Profile Cards Overlay */
        .profile-view-box {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #64f3e5;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            padding: 30px;
            box-sizing: border-box;
            width: 100%;
            max-width: 1150px;
            display: none;
        }
        .profile-view-box.active-view {
            display: block;
        }
        
        .premium-profile-card {
            display: flex;
            flex-direction: row;
            width: 100%;
            background: #06131c;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        
        .close-x-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #c0392b;
            color: white;
            border: 1px solid #ffffff;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .close-x-trigger:hover {
            background: #e74c3c;
        }
        
        /* Left Side Column Structure */
        .card-left-column {
            flex: 1;
            padding: 35px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            background: linear-gradient(135deg, rgba(14, 36, 48, 0.4) 0%, rgba(5, 13, 18, 0.4) 100%);
        }
        .rank-badge {
            font-weight: 700;
            font-size: 0.85rem;
            color: #ffd700;
            border: 1.5px solid #ffd700;
            padding: 4px 12px;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .card-player-title {
            font-size: 2.2rem;
            color: #ffffff;
            margin: 0 0 15px 0;
            word-break: break-all;
        }
        .tags-row {
            display: flex;
            gap: 8px;
            margin-bottom: auto;
        }
        .score-display-node {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffd700;
            margin-top: 30px;
        }
        .score-display-node span {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 6px;
        }
        
        /* Right Side Column Structure */
        .card-right-column {
            flex: 1.5;
            padding: 35px;
            box-sizing: border-box;
        }
        .right-column-header {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            margin: 0 0 25px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }
        .kits-display-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 25px;
        }
        .kit-slot-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .circle-frame {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 2px solid #64f3e5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.02);
            font-weight: bold;
            color: #ffffff;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(100, 243, 229, 0.2);
        }
        .circle-frame.empty-frame {
            border-color: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }
        .kit-slot-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .points-legend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .points-legend-item {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }
        .points-legend-item:last-child {
            border-bottom: none;
        }
        .points-legend-item span.tier-id-tag {
            font-weight: bold;
            color: #64f3e5;
        }
