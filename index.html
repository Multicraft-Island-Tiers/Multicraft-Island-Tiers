<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Gaming Hub</title>
    <!-- Web-Safe Pixel Font to recreate the official game style UI look seamlessly -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Base page theme config lines */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: #ffffff; 
            min-height: 100vh; 
            background: radial-gradient(circle at 30% 20%, #112d3e 0%, #06131c 70%);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #starfall-canvas {

            left: 0;

            height: 100vh; 
            z-index: 1; 
            pointer-events: none; 
        }

        /* Top Header Navigation Panel Module */
        .top-navbar {
            width: 100%;
            background: rgba(4, 11, 16, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .nav-links-left {
            display: flex;
            gap: 25px;
        }
        .nav-link-item {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-link-item:hover, .nav-link-item.active-nav {
            color: #64f3e5;
            text-shadow: 0 0 8px rgba(100, 243, 229, 0.4);
        }
        .search-mock-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 6px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.3);
            width: 160px;
            text-align: left;
        }

        /* Centered App View Frame Wrapper */
        .app-layout-frame {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Horizontal Custom Capsule Menu Tabs Layout */
        .kit-tabs-capsule-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .kit-tab-btn {
            background: rgba(14, 39, 53, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);

            font-size: 0.55rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .kit-tab-btn:hover {
            border-color: #64f3e5;
            color: #ffffff;
        }
        .kit-tab-btn.active-kit {
            background: #1a4d47;
            border-color: #64f3e5;
            color: #64f3e5;
            box-shadow: 0 0 12px rgba(100, 243, 229, 0.25);

        .rankings-display-view {
            display: none;
            width: 100%;
        }
        .rankings-display-view.active-view {
            display: block;
        }

        .player-pill-row:nth-child(3) .row-rank-node { color: #cd7f32; }

            border-color: #ffffff;

            font-size: 0.8rem;

            padding-bottom: 8px;

            flex-direction: column;
            gap: 8px;
