<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers</title>
    <style>
        :root {
            --bg-color: #0c0f12;
            --card-bg: #14181c;
            --modal-bg: #1b2228;
            --text-color: #f0f2f5;
            --accent-color: #6366f1;
            --border-color: #242b35;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn:hover, .btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .tier-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tier-row {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            min-height: 75px;
            border: 1px solid var(--border-color);
        }

        .tier-label {
            width: 120px;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000000;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        .tier-players {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            padding: 10px 20px;
            gap: 12px;
            flex-grow: 1;
        }

        .player-tag {
            background-color: #1c232b;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 150px;
            font-style: normal !important;
            white-space: nowrap;
        }

        .player-tag:hover {
            background-color: #252f3a;
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .player-name {
            font-weight: 700;
        }

        .player-meta {
            font-size: 0.75rem;
            color: #a0aec0;
            display: flex;
            gap: 6px;
        }

        .player-pts-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #6366f1;
            margin-top: 2px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background-color: var(--modal-bg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .modal-header {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .modal-subheader {
            font-size: 0.85rem;
            color: #a0aec0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #242b35;
        }

        .kit-row:last-child {
            border-bottom: none;
        }

        .kit-name {
            font-weight: 600;
            color: #e2e8f0;
        }

        .kit-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.85rem;
            color: #000000;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        .ht1 { background-color: #ff4d4d; }
        .lt1 { background-color: #ff8533; }
        .ht2 { background-color: #ffb31a; }
        .lt2 { background-color: #ffd633; }
        .ht3 { background-color: #a3e635; }
        .lt3 { background-color: #4ade80; }
        .ht4 { background-color: #2dd4bf; }
        .lt4 { background-color: #38bdf8; }
        .ht5 { background-color: #60a5fa; }
        .lt5 { background-color: #818cf8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="logo.png" alt="Multicraft Island Logo" style="max-width: 250px; height: auto; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));">
        <h1>Multicraft Island Tiers</h1>
        <div class="nav-buttons">
            <button class="btn active" onclick="switchView('overall', this)">Overall</button>
            <button class="btn" onclick="switchView('Emerald', this)">Emerald</button>
            <button class="btn" onclick="switchView('Diamond', this)">Diamond</button>
            <button class="btn" onclick="switchView('Dragonhide', this)">Dragonhide</button>
            <button class="btn" onclick="switchView('Dragonhide KB', this)">Dragonhide KB</button>
            <button class="btn" onclick="switchView('Emerald kb', this)">Emerald KB</button>
        </div>
    </header>

    <div class="tier-list" id="tierListStructure"></div>
</div>

<div class="modal-overlay" id="playerModal" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal(null)">&times;</button>
        <div class="modal-header" id="modalPlayerName">Player Details</div>
        <div class="modal-subheader" id="modalPlayerMeta">Device / Region</div>
        <div id="modalKitsContainer"></div>
    </div>
</div>

<script>
    // Tier rankings and their mathematical weight for overall calculation
    const tierWeights = {
        "HT1": 10, "LT1": 9, "HT2": 8, "LT2": 7, "HT3": 6,
        "LT3": 5, "HT4": 4, "LT4": 3, "HT5": 2, "LT5": 1
    };

    const orderedTiers = ["HT1", "LT1", "HT2", "LT2", "HT3", "LT3", "HT4", "LT4", "HT5", "LT5"];

    // Player Database
    const playerData = {
        "Husky_Multicraft": {
            "device": "PC",
            "region": "NA",
            "kits": {
                "Emerald": "LT2",
                "Diamond": "HT3",
                "Dragonhide": "HT3",
                "Dragonhide KB": "HT3",
                "Emerald kb": "LT3"
            }
        },
        "Prologozroc": {
            "device": "PE",
            "region": "EU",
            "kits": {
                "Emerald": "HT2",
                "Diamond": "LT2",
                "Dragonhide": "HT2",
                "Dragonhide KB": "LT2",
                "Emerald kb": "HT3"
            }
        }
        // Add more players here following the same structure
    };

    // Helper to calculate a player's average overall tier
    function getOverallTier(kits) {
        let totalScore = 0;
        let count = 0;
        for (let kit in kits) {
            if (tierWeights[kits[kit]]) {
                totalScore += tierWeights[kits[kit]];
                count++;
            }
        }
        if (count === 0) return "LT5";
        const avgScore = Math.round(totalScore / count);
        
        // Find tier code matching the average score
        for (let tier in tierWeights) {
            if (tierWeights[tier] === avgScore) return tier;
        }
        return "LT5";
    }

    // Renders the leaderboard structure based on selection
    function renderTiers(viewType) {
        const container = document.getElementById('tierListStructure');
        container.innerHTML = '';

        // Create rows for each tier
        orderedTiers.forEach(tierCode => {
            const row = document.createElement('div');
            row.className = 'tier-row';
            
            const label = document.createElement('div');
