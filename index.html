<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Tiers | Roster Hub</title>
    <style>
        /* Load your exact font file extension locally */
        @font-face {
            font-family: 'MulticraftCustom';
            src: url('MultiCraftFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 25px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #02070c;
            /* Premium galaxy space backing canvas matching your design specifications */
            background-image: radial-gradient(circle at 30% 50%, rgba(13, 38, 41, 0.6) 0%, rgba(2, 7, 12, 1) 70%),
                              radial-gradient(circle at 80% 40%, rgba(39, 13, 46, 0.4) 0%, rgba(2, 7, 12, 1) 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh; 
            box-sizing: border-box;
        }

        /* --- LOGO AT TOP BANNER --- */
        .logo-container { 
            width: 100%; 
            max-width: 1250px; 
            margin-bottom: 25px; 
            display: flex; 
            justify-content: flex-start; 
        }
        .logo-container img { 
            height: 48px; 
            width: auto; 
            object-fit: contain; 
        }

        /* --- STABLE GRID LAYOUT SYSTEM WRAPPER --- */
        .dashboard-layout-wrapper { 
            display: flex; 
            flex-direction: row; 
            gap: 25px; 
            width: 100%; 
            max-width: 1250px; 
            align-items: flex-start;
            box-sizing: border-box;
        }

        /* LEFT CONTENT LEADERBOARD BLOCK PANEL CONTAINER */
        .main-content-panel { 
            flex: 3; 
            display: flex; 
            flex-direction: column;
            min-width: 0;
            box-sizing: border-box;
        }

        .menu-title { 
            font-family: 'MulticraftCustom', monospace !important; 
            color: #64f3e5; 
            font-size: 1.1rem; 
            margin: 0 0 20px 0; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        /* --- PREMIUM CARD LEADERBOARD ROWS --- */
        .roster-card-row { 
            display: flex; 
            align-items: center; 
            background: rgba(3, 9, 16, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.04); 
            border-radius: 8px; 
            padding: 10px 18px; 
            margin-bottom: 6px; 
            box-sizing: border-box; 
            gap: 15px; 
            width: 100%; 
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .roster-card-row:hover {
            border-color: rgba(100, 243, 229, 0.25);
            background: rgba(4, 13, 24, 0.85);
        }
        .roster-card-row.hidden { display: none !important; }

        /* --- DYNAMIC RANK PLACEMENT OVERLAYS --- */
        .row-rank-num { 
            font-family: 'MulticraftCustom', monospace !important; 
            font-size: 1rem; 
            color: rgba(255, 255, 255, 0.3); 
            width: 35px; 
            text-align: center;
            flex-shrink: 0;
        }
        .roster-card-row.visible-rank-1 .row-rank-num { color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.3); }
        .roster-card-row.visible-rank-2 .row-rank-num { color: #c0c0c0; }
        .roster-card-row.visible-rank-3 .row-rank-num { color: #cd7f32; }

        /* --- PLAYER PROFILE NAME MATRIX BLOCKS --- */
        .player-info-container { display: flex; align-items: center; width: 220px; gap: 12px; flex-shrink: 0; }
        .player-avatar-box {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: #152737;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-avatar-box img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
        .row-player-name { font-family: 'MulticraftCustom', monospace !important; font-size: 0.85rem; font-weight: normal; color: #ffffff; margin: 0; }

        /* --- REGIONAL PILL PLATFORM TAG BADGES --- */
        .device-badge-group { display: flex; gap: 5px; flex-shrink: 0; width: 75px; }
        .table-pill { font-size: 0.5rem; font-weight: bold; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; display: inline-block; font-family: 'Segoe UI', sans-serif; letter-spacing: 0.5px; flex-shrink: 0; }
        .pill-na { color: #4facfe; border: 1px solid rgba(79, 172, 254, 0.2); background: rgba(79, 172, 254, 0.05); }
        .pill-eu { color: #fccb90; border: 1px solid rgba(252, 203, 144, 0.2); background: rgba(252, 203, 144, 0.05); }
        .pill-pc { color: #00f2fe; border: 1px solid rgba(0, 242, 254, 0.2); background: rgba(0, 242, 254, 0.05); }
        .pill-mob { color: #45f545; border: 1px solid rgba(69, 245, 69, 0.2); background: rgba(69, 245, 69, 0.05); }
        .pill-con { color: #ff9900; border: 1px solid rgba(255, 153, 0, 0.2); background: rgba(255, 153, 0, 0.05); }

        /* --- HORIZONTAL FIXED NO-SCROLL WEAPON INDICATORS --- */
        .player-kits-display { 
            display: flex; 
            gap: 6px; 
            flex: 1; 
            justify-content: flex-start; 
            align-items: center;
            min-width: 0; 
            box-sizing: border-box;
        }
        
        .tier-showcase-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 46px;
            border-radius: 5px;
            background: rgba(2, 7, 12, 0.6);
            box-sizing: border-box;
            padding: 2px;
            flex-shrink: 0;
        }
        .tier-showcase-box.green-border { border: 1px solid rgba(85, 255, 85, 0.35); color: #55ff55; }
        .tier-showcase-box.cyan-border { border: 1px solid rgba(85, 255, 255, 0.35); color: #55ffff; }
        .tier-showcase-box.purple-border { border: 1px solid rgba(175, 122, 197, 0.35); color: #af7ac5; }
        .tier-showcase-box.orange-border { border: 1px solid rgba(255, 170, 0, 0.35); color: #ffaa00; }

        .tier-showcase-box img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            margin-bottom: 2px;
            background: transparent !important;
            mix-blend-mode: color-dodge; /* Blends gray image textures cleanly into the dark theme canvas backplane */
            filter: brightness(1.2) contrast(1.15);
        }
        .tier-showcase-box span {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.42rem;
            text-transform: uppercase;
        }

        /* --- EXPONENTIAL SCORE WEIGHT PILL INJECTION BUTTONS --- */
        .row-points-total { 
            font-family: 'MulticraftCustom', monospace !important; 
            font-size: 0.75rem; 
            color: #ffffff; 
            min-width: 95px; 
            text-align: right; 
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }
        .points-capsule-badge {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 4px 8px;
            border-radius: 5px;
            color: #ffd700;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.2);
            display: inline-block;
        }

        /* --- STACKED FILTER LINKS TOP DECK BAR --- */
        .kit-navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 1250px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(4, 11, 18, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-sizing: border-box;
        }

        .kit-btn {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.52rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(6, 17, 28, 0.6);
            border: 1px solid rgba(100, 243, 229, 0.1);
            color: rgba(255, 255, 255, 0.45);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .kit-btn:hover { color: #64f3e5; border-color: rgba(100, 243, 229, 0.4); background: rgba(100, 243, 229, 0.05); }
        .kit-btn.active { color: #ffd700; border-color: #ffd700; background: rgba(255, 215, 0, 0.04); box-shadow: 0 0 10px rgba(255, 215, 0, 0.15); }

    <!-- DYNAMIC CORE LEADERBOARD SCRIPT MODULE -->
    <script>
        let currentKitFilter = 'all';

        function openPlayerModal(name, points, kitsObj) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalPoints').innerText = points;
            
            const gridContainer = document.getElementById('modalKitsGrid');
            gridContainer.innerHTML = '';
            
            for (const [kit, tier] of Object.entries(kitsObj)) {
                const row = document.createElement('div');
                row.className = 'modal-kit-row';
                row.innerHTML = `<span>${kit}</span><span class="tier-val">${tier}</span>`;
                gridContainer.appendChild(row);
            }
            
            document.getElementById('playerModal').classList.add('active');
        }

        function closePlayerModal(e) {
            if (e.target.id === 'playerModal') {
                document.getElementById('playerModal').classList.remove('active');
            }
        }

        function closePlayerModalForce() {
            document.getElementById('playerModal').classList.remove('active');
        }

        function filterKit(kitName, btnElement) {
            document.querySelectorAll('.kit-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentKitFilter = kitName;
            applyGlobalFilters();
        }

        function applyGlobalFilters() {
            const rows = Array.from(document.querySelectorAll('.roster-card-row'));
            
            rows.forEach(row => {
