<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers | Competitive Hub</title>
    <style>
        /* Base page layout - Dark outer space gaming atmosphere */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff; 
            min-height: 100vh; 
            box-sizing: border-box; 
            background: radial-gradient(circle at center, #0e2430 0%, #050d12 100%);
            overflow-x: hidden; 
            scroll-behavior: smooth;
        }
        
        .logo-container { 
            max-width: 600px; 
            width: 100%; 
            margin-bottom: 30px; 
            text-align: center; 
        }
        .logo-container img { 
            width: 100%; 
            height: auto; 
            border-radius: 12px; 
            border: 1px solid rgba(100, 243, 229, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }
        
        .dashboard-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 1050px;
            margin-bottom: 60px;
        }

        .menu-title {
            color: #64f3e5;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 40px 0 20px 0;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.3);
            width: 100%;
            max-width: 1050px;
            border-bottom: 2px solid #ffffff;
            padding-bottom: 10px;
        }
        
        /* Premium horizontal rows layout matching screenshots */
        .roster-card-row {
            display: flex;
            align-items: center;
            background: rgba(10, 22, 31, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 14px 20px;
            box-sizing: border-box;
            gap: 15px;
            text-decoration: none;
            color: #ffffff;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .roster-card-row:hover {
            border-color: #64f3e5;
            background: rgba(14, 34, 48, 0.9);
        }
        
        .row-rank-num {
            font-size: 1.1rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.4);
            width: 35px;
            text-align: center;
        }
        .roster-card-row:nth-child(2) .row-rank-num { color: #ffd700; }
        .roster-card-row:nth-child(3) .row-rank-num { color: #c0c0c0; }
        .roster-card-row:nth-child(4) .row-rank-num { color: #cd7f32; }

        .row-player-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #64f3e5;
            flex: 1;
        }
        
        /* Badge pill layout styles */
        .badge-pill {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            display: inline-block;
        }
        .pill-na { color: #4fc3f7; border: 1px solid #4fc3f7; background: rgba(79, 195, 247, 0.05); }
        .pill-eu { color: #fff176; border: 1px solid #fff176; background: rgba(255, 241, 118, 0.05); }
        .pill-pc { color: #ba68c8; border: 1px solid #ba68c8; background: rgba(186, 104, 200, 0.05); }
        .pill-mob { color: #81c784; border: 1px solid #81c784; background: rgba(129, 199, 132, 0.05); }
        .pill-con { color: #ffb74d; border: 1px solid #ffb74d; background: rgba(255, 183, 77, 0.05); }

        .row-kits-summary-strip {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .row-mini-kit-tag {
            font-size: 0.7rem;
            font-weight: 800;
            color: #0b1d28;
            background: #64f3e5;
            padding: 3px 7px;
            border-radius: 4px;
            border: 1px solid #ffffff;
        }
        .row-mini-kit-tag.tbd-tag {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.2);
        }

        .row-points-total-tag {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffd700;
            min-width: 90px;
            text-align: right;
        }

        /* Premium Split-Column Profile Cards Display Layout */
        .premium-split-profile-card {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1050px;
            background: #06131c;
            border: 2px solid rgba(100, 243, 229, 0.25);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            margin-bottom: 40px;
            position: relative;
            scroll-margin-top: 20px;
        }
        
        .close-x-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #c0392b;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 6px;
            padding: 5px 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .close-x-trigger:hover {
            background: #e74c3c;
        }
        
        .profile-left-column {
            flex: 1;
            padding: 35px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            background: linear-gradient(135deg, rgba(14, 36, 48, 0.3) 0%, rgba(5, 13, 18, 0.3) 100%);
        }
        .profile-rank-pill-badge {
            font-weight: 700;
            font-size: 0.8rem;
            color: #ffd700;
            border: 1.5px solid #ffd700;
            padding: 4px 12px;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .profile-player-header-title {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 15px 0;
            word-break: break-all;
        }
        .profile-meta-tags-row {
            display: flex;
            gap: 8px;
            margin-bottom: auto;
        }
        .profile-points-readout-node {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffd700;
            margin-top: 30px;
        }
        .profile-points-readout-node span {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 6px;
        }
        
        .profile-right-column {
            flex: 1.4;
            padding: 35px;
            box-sizing: border-box;
        }
        .profile-right-column-title {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            margin: 0 0 25px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 8px;
        }
        .profile-kits-display-circle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .kit-circle-slot-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .circle-badge-frame {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #64f3e5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.02);
            font-weight: 800;
            color: #ffffff;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(100, 243, 229, 0.15);
        }
        .circle-badge-frame.tbd-circle-frame {
            border-color: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }
        .kit-circle-slot-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 850px) {
            .premium-split-profile-card { flex-direction: column; }
            .profile-left-column { border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); width: 100%; }
            .row-kits-summary-strip { display: none; }
        }
    </style>
</head>
