<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Tiers | Roster Hub</title>
    <style>
        /* STARFIELD BACKGROUND & COSMIC THEMING */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #060c13 0%, #0a1428 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Starfield effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 10px, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            z-index: 0;
            pointer-events: none;
            animation: twinkle 3s ease-in-out infinite;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        .logo-container {
            max-width: 500px;
            width: 100%;
            margin-bottom: 25px;
            text-align: center;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(100, 243, 229, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .dashboard-layout-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        .main-content-panel {
            width: 100%;
            background: rgba(6, 12, 19, 0.85);
            border: 1px solid rgba(100, 243, 229, 0.2);
            border-radius: 14px;
            padding: 22px;
            box-sizing: border-box;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(100, 243, 229, 0.05);
            display: flex;
            flex-direction: column;
        }

        .menu-title {
            color: #64f3e5;
            font-size: 1.4rem;
            margin: 0 0 20px 0;
            border-bottom: 1px solid rgba(100, 243, 229, 0.2);
            padding-bottom: 14px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 10px rgba(100, 243, 229, 0.3);
        }

        .roster-card-row {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(10, 20, 35, 0.8) 0%, rgba(8, 15, 28, 0.8) 100%);
            border: 1px solid rgba(100, 243, 229, 0.15);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            gap: 15px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .roster-card-row:hover {
            border-color: rgba(100, 243, 229, 0.4);
            background: linear-gradient(135deg, rgba(15, 30, 50, 0.95) 0%, rgba(12, 22, 38, 0.95) 100%);
            box-shadow: 0 0 15px rgba(100, 243, 229, 0.2);
            transform: translateY(-2px);
        }

        .roster-card-row.hidden {
            display: none !important;
        }

        .row-rank-num {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.3);
            width: 40px;
            text-align: center;
            flex-shrink: 0;
            font-weight: 900;
        }

        .roster-card-row.visible-rank-1 .row-rank-num {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .roster-card-row.visible-rank-2 .row-rank-num {
            color: #c0c0c0;
            text-shadow: 0 0 6px rgba(192, 192, 192, 0.3);
        }

        .roster-card-row.visible-rank-3 .row-rank-num {
            color: #cd7f32;
            text-shadow: 0 0 6px rgba(205, 127, 50, 0.3);
        }

        .player-info-container {
            display: flex;
            align-items: center;
            width: 220px;
            gap: 10px;
            flex-shrink: 0;
        }

        .row-player-name {
            font-size: 1.05rem;
            color: #ffffff;
            text-transform: none;
            margin: 0;
        }

        .table-pill {
            font-size: 0.55rem;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 3px;
            text-transform: uppercase;
            display: inline-block;
            font-family: sans-serif;
            letter-spacing: 0.5px;
        }

        .pill-na { color: #5dade2; border: 1px solid rgba(93, 189, 226, 0.35); background: rgba(93, 189, 226, 0.08); }
        .pill-eu { color: #f4d03f; border: 1px solid rgba(244, 208, 63, 0.35); background: rgba(244, 208, 63, 0.08); }
        .pill-pc { color: #af7ac5; border: 1px solid rgba(175, 122, 197, 0.35); background: rgba(175, 122, 197, 0.08); }
        .pill-mob { color: #52be80; border: 1px solid rgba(82, 190, 128, 0.35); background: rgba(82, 190, 128, 0.08); }
        .pill-con { color: #e59866; border: 1px solid rgba(229, 152, 102, 0.35); background: rgba(229, 152, 102, 0.08); }

        .player-kits-display {
            display: flex;
            gap: 6px;
            flex: 1;
            justify-content: flex-start;
            align-items: center;
            min-width: 0;
            flex-wrap: wrap;
        }

        .tier-showcase-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 56px;
            border-radius: 6px;
            background: rgba(2, 7, 12, 0.6);
            box-sizing: border-box;
            padding: 3px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .tier-showcase-box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(100, 243, 229, 0.3);
        }

        .tier-showcase-box.green-border { border: 1.5px solid rgba(82, 190, 128, 0.5); color: #52be80; }
        .tier-showcase-box.cyan-border { border: 1.5px solid rgba(100, 243, 229, 0.5); color: #64f3e5; }
        .tier-showcase-box.purple-border { border: 1.5px solid rgba(175, 122, 197, 0.5); color: #af7ac5; }
        .tier-showcase-box.orange-border { border: 1.5px solid rgba(229, 152, 102, 0.5); color: #e59866; }

        .tier-showcase-box img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            margin-bottom: 2px;
            background-color: transparent;
            mix-blend-mode: color-dodge;
            filter: brightness(1.2) contrast(1.1);
        }

        .tier-showcase-box span {
            font-size: 0.58rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .row-points-total {
            font-size: 1.1rem;
            color: #ffd700;
            min-width: 95px;
            text-align: right;
            flex-shrink: 0;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .kit-navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(6, 17, 28, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(100, 243, 229, 0.15);
            box-sizing: border-box;
            backdrop-filter: blur(8px);
        }

        .kit-btn {
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(8, 18, 30, 0.7);
            border: 1px solid rgba(100, 243, 229, 0.15);
            color: rgba(255, 255, 255, 0.5);
            width: 110px;
            height: 90px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-sizing: border-box;
            font-weight: bold;
        }

        .kit-btn img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            opacity: 0.6;
            mix-blend-mode: color-dodge;
            filter: brightness(1.2) contrast(1.1);
        }

        .kit-btn:hover {
            color: #64f3e5;
            border-color: rgba(100, 243, 229, 0.35);
            background: rgba(100, 243, 229, 0.08);
            transform: translateY(-2px);
        }

        .kit-btn.active {
            color: #64f3e5;
            border-color: #64f3e5;
            background: rgba(100, 243, 229, 0.15);
            box-shadow: 0 0 15px rgba(100, 243, 229, 0.3), inset 0 0 10px rgba(100, 243, 229, 0.1);
        }

        .sidebar-panel {
            background: rgba(10, 20, 35, 0.8);
            border: 1px solid rgba(100, 243, 229, 0.2);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .sidebar-panel h3 {
            color: #64f3e5;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(100, 243, 229, 0.2);
            padding-bottom: 12px;
            margin: 0 0 15px 0;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(100, 243, 229, 0.2);
        }

        .points-legend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            width: 100%;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .points-legend-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(8, 15, 28, 0.6);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(100, 243, 229, 0.2);
            transition: all 0.2s ease;
        }

        .points-legend-item:hover {
            border-color: rgba(100, 243, 229, 0.4);
            background: rgba(10, 20, 35, 0.8);
        }

        .points-legend-item span.tier-id-tag {
            color: #64f3e5;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .points-legend-item span.points-weight-tag {
            color: #ffd700;
            font-weight: 900;
        }

        @media (max-width: 768px) {
            .player-kits-display {
                max-width: 200px;
            }

            .kit-navbar {
                gap: 8px;
            }

            .kit-btn {
                width: 90px;
                height: 75px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="Multicraft Server Banner">
    </div>
    
    <div class="kit-navbar">
        <button class="kit-btn active" onclick="filterKit('all', this)">
            <img src="overall.png" alt="Overall" onerror="this.style.visibility='hidden'"> Overall
        </button>
        <button class="kit-btn" onclick="filterKit('emerald', this)">
            <img src="Emerald.png" alt="Emerald"> Emerald
        </button>
        <button class="kit-btn" onclick="filterKit('emerald-kb', this)">
            <img src="Emerald_KB.png" alt="Emerald KB"> Emerald KB
        </button>
        <button class="kit-btn" onclick="filterKit('dragonhide-kb', this)">
            <img src="Dragonhide_KB.png" alt="Dragonhide KB"> Dragonhide KB
        </button>
        <button class="kit-btn" onclick="filterKit('dragonhide', this)">
            <img src="Dragonhide.png" alt="Dragonhide"> Dragonhide
        </button>
        <button class="kit-btn" onclick="filterKit('diamond', this)">
            <img src="Diamond.png" alt="Diamond"> Diamond
        </button>
    </div>
    
    <div class="dashboard-layout-wrapper">
        <div class="main-content-panel">
            <h2 class="menu-title" id="leaderboard-title">Overall Leaderboard</h2>
            <div id="roster-list-container">
                <!-- Dynamically populated from players.json -->
            </div>
        </div> 

        <!-- INTEGRATED FOOTER MODULE: Arranged horizontally -->
        <div class="sidebar-panel">
            <h3>Tier Points System</h3>
            <ul class="points-legend-grid">
                <li class="points-legend-item"><span class="tier-id-tag">HT1</span><span class="points-weight-tag">100 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">LT1</span><span class="points-weight-tag">85 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">HT2</span><span class="points-weight-tag">75 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">LT2</span><span class="points-weight-tag">60 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">HT3</span><span class="points-weight-tag">40 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">LT3</span><span class="points-weight-tag">30 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">HT4</span><span class="points-weight-tag">25 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">LT4</span><span class="points-weight-tag">15 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">HT5</span><span class="points-weight-tag">8 Pts</span></li>
                <li class="points-legend-item"><span class="tier-id-tag">LT5</span><span class="points-weight-tag">3 Pts</span></li>
            </ul>
        </div>
    </div>

    <script>
        let currentKitFilter = 'all';
        let playersData = [];

        const pointMatrix = {
            'HT1': 100, 'LT1': 85, 'HT2': 75, 'LT2': 60,
            'HT3': 40,  'LT3': 30, 'HT4': 25, 'LT4': 15,
            'HT5': 8,   'LT5': 3
        };

        const pillColorMap = {
            'NA': 'pill-na',
            'EU': 'pill-eu',
            'PC': 'pill-pc',
            'MOB': 'pill-mob',
            'CTRL': 'pill-con'
        };

        const tierColorMap = {
            'HT1': 'green-border', 'LT1': 'cyan-border',
            'HT2': 'green-border', 'LT2': 'cyan-border',
            'HT3': 'purple-border', 'LT3': 'purple-border',
            'HT4': 'green-border', 'LT4': 'cyan-border',
            'HT5': 'green-border', 'LT5': 'orange-border'
        };

        // Load player data from JSON
        async function loadPlayerData() {
            try {
                const response = await fetch('players.json');
                playersData = await response.json();
                renderPlayerRows();
                applyGlobalFilters();
            } catch (error) {
                console.error('Error loading player data:', error);
            }
        }

        // Build player row HTML
        function buildPlayerRow(player) {
            const kitsStr = player.kits.join(',');
            let pillsHTML = '';
            player.regions.forEach(region => {
                pillsHTML += `<span class="table-pill ${pillColorMap[region]}">${region}</span>`;
            });
            player.platforms.forEach(platform => {
                pillsHTML += `<span class="table-pill ${pillColorMap[platform]}">${platform}</span>`;
            });

            let achievementsHTML = '';
            player.achievements.forEach(achievement => {
                const kitName = achievement.kit.toUpperCase().replace('-', ' ');
                const kitImg = achievement.kit === 'emerald-kb' ? 'Emerald_KB.png' : 
                               achievement.kit === 'dragonhide-kb' ? 'Dragonhide_KB.png' : 
                               achievement.kit.charAt(0).toUpperCase() + achievement.kit.slice(1) + '.png';
                const borderClass = tierColorMap[achievement.tier];
                achievementsHTML += `<div class="tier-showcase-box ${borderClass}"><img src="${kitImg}" alt="${kitName}"><span>${achievement.tier}</span></div>`;
            });

            return `
                <div class="roster-card-row" data-kits="${kitsStr}" data-points="${player.totalPoints}">
                    <div class="row-rank-num">#${player.rank}</div>
                    <div class="player-info-container">
                        <span class="row-player-name">${player.name}</span>
                        ${pillsHTML}
                    </div>
                    <div class="player-kits-display">
                        ${achievementsHTML}
                    </div>
                    <div class="row-points-total">${player.totalPoints} PTS</div>
                </div>
            `;
        }

        // Render all player rows
        function renderPlayerRows() {
            const container = document.getElementById('roster-list-container');
            container.innerHTML = playersData.map(player => buildPlayerRow(player)).join('');
        }

        function filterKit(kitName, btnElement) {
            document.querySelectorAll('.kit-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentKitFilter = kitName;
            applyGlobalFilters();
        }

        function applyGlobalFilters() {
            const rows = Array.from(document.querySelectorAll('.roster-card-row'));
            
            rows.forEach(row => {
                const connectedKits = row.getAttribute('data-kits').split(',');
                const matchesKit = (currentKitFilter === 'all' || connectedKits.includes(currentKitFilter));
                
                // DEEP CACHE SANITIZATION: Completely strips out all old rank colors to clear browser memory
                row.className = 'roster-card-row';
                
                if (matchesKit) {
                    row.classList.remove('hidden');
                    
                    if (currentKitFilter === 'all') {
                        const originalPoints = row.getAttribute('data-points');
                        row.querySelector('.row-points-total').innerText = originalPoints + " PTS";
                        row.setAttribute('data-current-sort-score', originalPoints);
                    } 
                    else if (currentKitFilter === 'emerald-kb' || currentKitFilter === 'dragonhide-kb') {
                        row.querySelector('.row-points-total').innerText = "0 PTS";
                        row.setAttribute('data-current-sort-score', '0');
                    } 
                    else {
                        let specificScore = 0;
                        const kitBoxes = row.querySelectorAll('.tier-showcase-box');
                        
                        kitBoxes.forEach(box => {
                            const imgAlt = box.querySelector('img').getAttribute('alt').toLowerCase().replace('_', '-');
                            if (imgAlt === currentKitFilter) {
                                const tierText = box.querySelector('span').innerText.trim().toUpperCase();
                                if (pointMatrix[tierText]) {
                                    specificScore = pointMatrix[tierText];
                                }
                            }
                        });
                        
                        row.querySelector('.row-points-total').innerText = specificScore + " PTS";
                        row.setAttribute('data-current-sort-score', specificScore);
                    }
                } else {
                    row.classList.add('hidden');
                    row.setAttribute('data-current-sort-score', '-1');
                }
            });

            const listContainer = document.getElementById('roster-list-container');
            
            // PRIORITY LOOP SORT: Checks active points first, breaks ties via total overall points attribute
            const sortedRows = rows.filter(r => !r.classList.contains('hidden'))
                                   .sort((a, b) => {
                                        const scoreA = parseInt(a.getAttribute('data-current-sort-score'));
                                        const scoreB = parseInt(b.getAttribute('data-current-sort-score'));
                                        
                                        if (scoreB !== scoreA) {
                                            return scoreB - scoreA;
                                        }
                                        
                                        const overallA = parseInt(a.getAttribute('data-points'));
                                        const overallB = parseInt(b.getAttribute('data-points'));
                                        if (overallB !== overallA) {
                                            return overallB - overallA;
                                        }
                                        
                                        const nameA = a.querySelector('.row-player-name').innerText.toLowerCase();
                                        const nameB = b.querySelector('.row-player-name').innerText.toLowerCase();
                                        return nameA.localeCompare(nameB);
                                   });

            let visibleRankCounter = 1;
            sortedRows.forEach(row => {
                // Force-writes the inner text component to completely bypass browser formatting glitches
                row.querySelector('.row-rank-num').innerText = "#" + visibleRankCounter;
                
                if (visibleRankCounter === 1) row.classList.add('visible-rank-1');
                if (visibleRankCounter === 2) row.classList.add('visible-rank-2');
                if (visibleRankCounter === 3) row.classList.add('visible-rank-3');
                
                listContainer.appendChild(row);
                visibleRankCounter++;
            });

            const titleElement = document.getElementById('leaderboard-title');
            titleElement.innerText = currentKitFilter === 'all' ? 'Overall Leaderboard' : currentKitFilter.replace('-', ' ').toUpperCase() + ' Leaderboard';
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadPlayerData();
        });
    </script>
</body>
</html>
