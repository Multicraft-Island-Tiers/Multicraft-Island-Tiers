    <style>
        /* Load your exact font file extension locally */
        @font-face {
            font-family: 'MulticraftCustom';
            src: url('MultiCraftFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            /* FIXED BACKGROUND PIPELINE: Points directly to your image asset so it cannot be blocked */
            background: #02070c url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- LOGO BANNER FRAME PLACEMENT --- */
        .logo-container { width: 100%; max-width: 1250px; margin-bottom: 25px; display: flex; justify-content: center; }
        .logo-container img { height: 60px; width: auto; object-fit: contain; }

        /* --- FIXED FULL-WIDTH GRID WRAPPER --- */
        .dashboard-layout-wrapper { 
            display: flex; 
            flex-direction: row; 
            gap: 25px; 
            width: 100%; 
            max-width: 1250px; 
            align-items: flex-start;
            box-sizing: border-box;
        }

        /* FULL TRANSPARENCY SHIELD: Drops raw dark boxes so your background image pops completely */
        .main-content-panel { 
            flex: 3; 
            background: rgba(4, 11, 18, 0.25); /* Melted backdrop density to let stars through */
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 14px; 
            padding: 22px; 
            box-sizing: border-box; 
            backdrop-filter: blur(8px); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); 
            display: flex; 
            flex-direction: column;
            min-width: 0;
        }

        .menu-title { font-family: 'MulticraftCustom', monospace !important; color: #64f3e5; font-size: 1.2rem; margin: 0 0 20px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 14px; text-transform: uppercase; text-align: center; }

        /* UN-GLITCHED CARDS LAYOUT: Locked parameters side-by-side inside main viewport panel container */
        .roster-card-row { 
            display: flex; 
            align-items: center; 
            background: rgba(6, 15, 24, 0.45); /* Highly transparent row blocks */
            border: 1px solid rgba(100, 243, 229, 0.15); 
            border-radius: 10px; 
            padding: 10px 20px; 
            margin-bottom: 8px; 
            box-sizing: border-box; 
            gap: 20px; 
            width: 100%; 
        }
        .roster-card-row.hidden { display: none !important; }

        /* UN-SHIFTED NUMERICAL INDICATOR LABELS */
        .row-rank-num { 
            font-family: 'MulticraftCustom', monospace !important; 
            font-size: 1.1rem; 
            color: rgba(255, 255, 255, 0.4); 
            width: 45px; 
            text-align: left;
            flex-shrink: 0;
        }
        .roster-card-row.visible-rank-1 .row-rank-num { color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.3); }
        .roster-card-row.visible-rank-2 .row-rank-num { color: #c0c0c0; }
        .roster-card-row.visible-rank-3 .row-rank-num { color: #cd7f32; }

        .player-info-container { display: flex; align-items: center; width: 190px; gap: 10px; flex-shrink: 0; }
        .row-player-name { font-family: 'MulticraftCustom', monospace !important; font-size: 0.95rem; font-weight: normal; color: #ffffff; text-transform: none !important; margin: 0; }

        /* FIXED CAPSULE POINT LAYOUT SECTIONS */
        .row-points-total { 
            font-family: 'MulticraftCustom', monospace !important; 
            font-size: 0.85rem; 
            color: #ffffff; 
            min-width: 100px; 
            text-align: right; 
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;

            padding: 4px 8px;
            border-radius: 5px;

        .pill-na { color: #3498db; border: 1px solid rgba(52, 152, 219, 0.3); background: rgba(52, 152, 219, 0.05); }

    <!-- REAL-TIME INTERACTIVE FILTER ENGINE -->
    <script>
        let currentKitFilter = 'all';

        function filterKit(kitName, btnElement) {
            document.querySelectorAll('.kit-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentKitFilter = kitName;
            applyGlobalFilters();
        }

        function applyGlobalFilters() {
            const rows = Array.from(document.querySelectorAll('.roster-card-row'));
            
            rows.forEach(row => {
                const connectedKits = row.getAttribute('data-kits').split(',');
                const matchesKit = (currentKitFilter === 'all' || connectedKits.includes(currentKitFilter));
                
                if (matchesKit) {
                    row.classList.remove('hidden');
                } else {
                    row.classList.add('hidden');
                }
            });

            const listContainer = document.getElementById('roster-list-container');
            const sortedRows = rows.filter(r => !r.classList.contains('hidden'))
                                   .sort((a, b) => parseInt(b.getAttribute('data-points')) - parseInt(a.getAttribute('data-points')));

            let visibleRankCounter = 1;
            sortedRows.forEach(row => {
                row.classList.remove('visible-rank-1', 'visible-rank-2', 'visible-rank-3');
                row.querySelector('.row-rank-num').innerText = "#" + visibleRankCounter;
                
                if (visibleRankCounter === 1) row.classList.add('visible-rank-1');
                if (visibleRankCounter === 2) row.classList.add('visible-rank-2');
                if (visibleRankCounter === 3) row.classList.add('visible-rank-3');
                
                listContainer.appendChild(row);
                visibleRankCounter++;
            });

            rows.forEach(row => {
                if (!sortedRows.includes(row)) {
                    row.classList.add('hidden');
                }
            });

            const titleElement = document.getElementById('leaderboard-title');
            titleElement.innerText = currentKitFilter === 'all' ? 'Overall Leaderboard' : currentKitFilter.replace('-', ' ') + ' Leaderboard';
        }

        document.addEventListener("DOMContentLoaded", () => {
            applyGlobalFilters();
        });
    </script>
