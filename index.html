<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Tiers | Roster Hub</title>
    <style>
        /* Local typography dynamic font pipeline assignment */
        @font-face {
            font-family: 'MulticraftCustom';
            src: url('MultiCraftFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #060c13; /* Solid rich deep space theme color backdrop */
            color: #ffffff;
            min-height: 100vh; 
            box-sizing: border-box;
        }
        
        /* BANNER CONSTRAINT CONTAINER: Strict bounds prevent column-choking shifts */
        .logo-container { width: 100%; max-width: 500px; margin-bottom: 15px; text-align: center; display: block; }
        .logo-container img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid rgba(100, 243, 229, 0.15); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }

        /* --- PRIMARY LINK FILTER NAVBAR --- */
        .kit-navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 1250px;
            margin-bottom: 25px;
            padding: 12px;
            background: rgba(4, 11, 18, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-sizing: border-box;
        }

        .kit-btn {
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.55rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(6, 17, 28, 0.6);
            border: 1px solid rgba(100, 243, 229, 0.1);
            color: rgba(255, 255, 255, 0.45);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .kit-btn:hover { color: #64f3e5; border-color: rgba(100, 243, 229, 0.4); }
        .kit-btn.active { color: #64f3e5; border-color: #64f3e5; background: rgba(100, 243, 229, 0.12); box-shadow: 0 0 10px rgba(100, 243, 229, 0.2); }

        .dashboard-layout-wrapper { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            max-width: 1250px; 
            box-sizing: border-box;
        }

        /* --- DYNAMIC PODIUM CONTAINER PLATFORMS --- */
        .podium-backdrop-container {
            display: none; /* Hidden strictly during Overall, toggles block view in kit view */
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
        }
        .podium-backdrop-container.active { display: flex; }

        .podium-spot-box { display: flex; flex-direction: column; align-items: center; width: 120px; box-sizing: border-box; }
        .podium-spot-box .podium-name { font-family: 'MulticraftCustom', monospace !important; font-size: 0.75rem; margin: 0 0 8px 0; text-align: center; white-space: nowrap; color: #ffffff; }
        .podium-base-block { width: 100%; background: rgba(4, 11, 18, 0.75); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; position: relative; }
        .podium-base-block span.rank-indicator { font-family: 'MulticraftCustom', monospace !important; font-size: 1.8rem; font-weight: bold; }
        
        .podium-base-block span.tier-subtag {
            position: absolute;
            bottom: -16px;
            font-family: 'MulticraftCustom', monospace !important;
            font-size: 0.45rem;
            padding: 2px 4px;
            border-radius: 3px;
            background: rgba(2, 7, 12, 0.9);
            white-space: nowrap;
        }

        /* Pedestal Structural Height Scaling Steps */
        .spot-1 { order: 2; }
        .spot-1 .podium-base-block { height: 75px; border: 1.5px solid #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.15); }
        .spot-1 .rank-indicator { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
        .spot-1 .tier-subtag { border: 1px solid rgba(255, 215, 0, 0.3); color: #ffd700; }

        .spot-2 { order: 1; }
        .spot-2 .podium-base-block { height: 60px; border: 1.5px solid #c0c0c0; }
        .spot-2 .rank-indicator { color: #c0c0c0; }
        .spot-2 .tier-subtag { border: 1px solid rgba(192, 192, 192, 0.3); color: #c0c0c0; }

        .spot-3 { order: 3; }
        .spot-3 .podium-base-block { height: 50px; border: 1.5px solid #cd7f32; }
        .spot-3 .rank-indicator { color: #cd7f32; }
        .spot-3 .tier-subtag { border: 1px solid rgba(205, 127, 50, 0.3); color: #cd7f32; }

        /* --- DASHBOARD DISPLAY CONTAINER MODES --- */
        .main-content-panel { width: 100%; box-sizing: border-box; }
        
        /* View Mode A: Linear Column Cascade Stack */
        #roster-list-container.view-overall { display: flex; flex-direction: column; width: 100%; max-width: 950px; margin: 0 auto; }
        #roster-list-container.view-overall .roster-card-row { display: flex; align-items: center; background: rgba(4, 13, 22, 0.75); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 12px 18px; margin-bottom: 8px; gap: 15px; width: 100%; box-sizing: border-box; }

        /* View Mode B: 5-Column Split Dashboard Layout */
        #roster-list-container.view-columns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 100%; }
        .tier-column-wrapper { display: flex; flex-direction: column; background: rgba(4, 11, 18, 0.2); border-radius: 10px; padding: 5px; min-height: 200px; }
        
        .tier-column-wrapper h4 {
            font-family: 'MulticraftCustom', monospace !important;
            color: #64f3e5;
            font-size: 0.75rem;
            text-align: center;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(100, 243, 229, 0.2);
            padding-bottom: 8px;
        }

        /* Structural row reshaping inside active column boxes */
        #roster-list-container.view-columns .roster-card-row { display: flex; flex-direction: column; align-items: center; background: rgba(4, 13, 22, 0.85); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 8px; padding: 12px 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; gap: 8px; text-align: center; }

        /* Flex field scaling handles based on parameters active */
        .row-rank-num { font-family: 'MulticraftCustom', monospace !important; font-size: 0.85rem; color: rgba(255, 255, 255, 0.25); width: 40px; text-align: center; flex-shrink: 0; }
        #roster-list-container.view-columns .row-rank-num { display: none !important; }

        .player-info-container { display: flex; align-items: center; width: 220px; gap: 10px; flex-shrink: 0; }
        #roster-list-container.view-columns .player-info-container { flex-direction: column; width: 100%; gap: 6px; }

        .row-player-name { font-family: 'MulticraftCustom', monospace !important; font-size: 0.85rem; font-weight: normal; color: #ffffff; text-transform: none !important; margin: 0; }
        .device-badge-group { display: flex; gap: 4px; }
        
        .row-points-total { font-family: 'MulticraftCustom', monospace !important; font-size: 0.8rem; color: #ffd700; min-width: 95px; text-align: right; flex-shrink: 0; margin-left: auto; }
        #roster-list-container.view-columns .row-points-total { margin: 0 auto; text-align: center; font-size: 0.65rem; }

        .table-pill { font-size: 0.52rem; font-weight: bold; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; display: inline-block; font-family: 'Segoe UI', sans-serif; }
        .pill-na { color: #5dade2; border: 1px solid rgba(93, 189, 226, 0.25); background: rgba(93, 189, 226, 0.04); }
        .pill-eu { color: #f4d03f; border: 1px solid rgba(244, 208, 63, 0.25); background: rgba(244, 208, 63, 0.04); }
        .pill-pc { color: #af7ac5; border: 1px solid rgba(175, 122, 197, 0.25); background: rgba(175, 122, 197, 0.04); }
        .pill-mob { color: #52be80; border: 1px solid rgba(82, 190, 128, 0.25); background: rgba(82, 190, 128, 0.04); }
        .pill-con { color: #e59866; border: 1px solid rgba(229, 152, 102, 0.25); background: rgba(229, 152, 102, 0.04); }

        /* Weapon display wrappers constraints */
        .player-kits-display { display: flex; gap: 5px; flex: 1; justify-content: flex-start; align-items: center; min-width: 0; }
        #roster-list-container.view-columns .player-kits-display { display: none !important; }
        
        .tier-showcase-box { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 52px; border-radius: 5px; background: rgba(2, 7, 12, 0.5); box-sizing: border-box; padding: 2px; flex-shrink: 0; }
        .tier-showcase-box.green-border { border: 1px solid rgba(82, 190, 128, 0.4); color: #52be80; }

        .tier-showcase-box.purple-border { border: 1px solid rgba(175, 122, 197, 0.4); color: #af7ac5; }
        .tier-showcase-box.orange-border { border: 1px solid rgba(229, 152, 102, 0.4); color: #e59866; }

    <!-- MASTER DYNAMIC PODIUM & SPLIT-GRID LAYOUT ENGINE -->
    <script>
        let currentKitFilter = 'all';

        // Translation point reference matrix map used to compute tier weights accurately
        const pointMatrix = {
            'HT1': 100, 'LT1': 85, 'HT2': 75, 'LT2': 60,
            'HT3': 40,  'LT3': 30, 'HT4': 25, 'LT4': 15,
            'HT5': 8,   'LT5': 3
        };

        function filterKit(kitName, btnElement) {
            document.querySelectorAll('.kit-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentKitFilter = kitName;
            applyGlobalFilters();
        }

        function applyGlobalFilters() {
            const listContainer = document.getElementById('roster-list-container');
            const podiumZone = document.getElementById('podium-zone');
            const rows = Array.from(document.querySelectorAll('.roster-card-row'));
            
            // Wipe standard container loops to prepare for re-injection
            listContainer.innerHTML = '';
            podiumZone.classList.remove('active');
            
            let filteredActiveRows = [];

            // Step 1: Assign local points evaluation variables per kit selection
            rows.forEach(row => {
                const connectedKits = row.getAttribute('data-kits').split(',');
                const matchesKit = (currentKitFilter === 'all' || connectedKits.includes(currentKitFilter));
                
                if (matchesKit) {
                    row.classList.remove('hidden');
                    
                    if (currentKitFilter === 'all') {
                        const originalTotalPoints = row.getAttribute('data-points');
                        row.querySelector('.row-points-total').innerText = originalTotalPoints + " PTS";
                        row.setAttribute('data-current-sort-score', originalTotalPoints);
                        row.setAttribute('data-active-tier', 'N/A');
                    } else {
                        let dynamicKitScore = 0;
                        let detectedTierString = 'LT5';
                        const internalShowcaseBoxes = row.querySelectorAll('.tier-showcase-box');
                        
                        internalShowcaseBoxes.forEach(box => {
                            const imgAltTag = box.querySelector('img').getAttribute('alt').toLowerCase().replace('_', '-');
                            if (imgAltTag === currentKitFilter) {
                                detectedTierString = box.querySelector('span').innerText.trim().toUpperCase();
                                if (pointMatrix[detectedTierString]) {
                                    dynamicKitScore = pointMatrix[detectedTierString];
                                }
                            }
                        });
                        
                        row.querySelector('.row-points-total').innerText = dynamicKitScore + " PTS";
                        row.setAttribute('data-current-sort-score', dynamicKitScore);
                        row.setAttribute('data-active-tier', detectedTierString);
                    }
                    filteredActiveRows.push(row);
                } else {
                    row.classList.add('hidden');
                    row.setAttribute('data-current-sort-score', '-1');
                }
            });

            // Step 2: Sort matched entities descending by target weight attribute
            filteredActiveRows.sort((a, b) => parseInt(b.getAttribute('data-current-sort-score')) - parseInt(a.getAttribute('data-current-sort-score')));

            // --- VIEW MODULE A: OVERALL TOTAL LINEAR CASCADE ---
            if (currentKitFilter === 'all') {
                listContainer.className = 'view-overall';
                
                let numericRankCounter = 1;
                filteredActiveRows.forEach(row => {
                    row.classList.remove('visible-rank-1', 'visible-rank-2', 'visible-rank-3');
                    row.querySelector('.row-rank-num').innerText = "#" + numericRankCounter;
                    
                    if (numericRankCounter === 1) row.classList.add('visible-rank-1');
                    if (numericRankCounter === 2) row.classList.add('visible-rank-2');
                    if (numericRankCounter === 3) row.classList.add('visible-rank-3');
                    
                    listContainer.appendChild(row);
                    numericRankCounter++;
                });
                
            } else {
                // --- VIEW MODULE B: KIT PODIUM & T1-T5 SPLIT COLUMNS CONTAINER ---
                listContainer.className = 'view-columns';
                podiumZone.classList.add('active');

                // Bind high-score index tracks securely to structural pedestals
                if (filteredActiveRows[0]) {
                    document.getElementById('podium-1-name').innerText = filteredActiveRows[0].querySelector('.row-player-name').innerText;
                    document.getElementById('podium-1-tier').innerText = filteredActiveRows[0].getAttribute('data-active-tier');
                } else {
                    document.getElementById('podium-1-name').innerText = "---";
                }
                
                if (filteredActiveRows[1]) {
                    document.getElementById('podium-2-name').innerText = filteredActiveRows[1].querySelector('.row-player-name').innerText;
                    document.getElementById('podium-2-tier').innerText = filteredActiveRows[1].getAttribute('data-active-tier');
                } else {
                    document.getElementById('podium-2-name').innerText = "---";
                }
                
                if (filteredActiveRows[2]) {
                    document.getElementById('podium-3-name').innerText = filteredActiveRows[2].querySelector('.row-player-name').innerText;
                    document.getElementById('podium-3-tier').innerText = filteredActiveRows[2].getAttribute('data-active-tier');
                } else {
                    document.getElementById('podium-3-name').innerText = "---";
                }

                // Loop layout blocks and assemble T1 down to T5 column shells dynamically
                for (let i = 1; i <= 5; i++) {
                    const columnWrapper = document.createElement('div');
                    columnWrapper.className = 'tier-column-wrapper';
                    columnWrapper.innerHTML = `<h4>T${i}</h4>`;
                    
                    filteredActiveRows.forEach(row => {
                        const playerTierNum = row.getAttribute('data-active-tier');
                        if (playerTierNum && playerTierNum.includes(i.toString())) {
                            // Elements clone nicely to avoid breaking background sheet allocations
                            const clonedRow = row.cloneNode(true);
                            columnWrapper.appendChild(clonedRow);
                        }
                    });
                    
                    listContainer.appendChild(columnWrapper);
                }
            }

            const titleElement = document.getElementById('leaderboard-title');
            titleElement.innerText = currentKitFilter === 'all' ? 'Overall Leaderboard' : currentKitFilter.replace('-', ' ') + ' Leaderboard';
        }

        document.addEventListener("DOMContentLoaded", () => {
            applyGlobalFilters();
        });
    </script>
