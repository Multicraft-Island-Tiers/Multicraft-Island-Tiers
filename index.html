    <script>
        // Multi-Layer Collection Filter - Calculates search queries, regions, and device modules concurrently
        function getFilteredCollection(viewMode) {
            const searchTerms = document.getElementById('global-search-input-field').value.toLowerCase().trim();
            const filterRegion = document.getElementById('region-filter-select-node').value;
            const filterDevice = document.getElementById('device-filter-select-node').value;
            const filterKitDropdown = document.getElementById('kit-filter-select-node').value;

            return Object.values(globalCompetitiveDatabase).filter(player => {
                if (searchTerms && !player.name.toLowerCase().includes(searchTerms)) return false;
                if (filterRegion !== 'all' && player.region.toLowerCase() !== filterRegion) return false;
                if (filterDevice !== 'all' && player.device.toLowerCase() !== filterDevice) return false;
                
                if (viewMode === 'overall' && filterKitDropdown !== 'all') {
                    const rawVal = player[filterKitDropdown];
                    if (!rawVal || rawVal === 'TBD') return false;
                }
                return true;
            });
        }

        // Window Screen Routing Switcher - Controls layout panels dynamically across screens
        function toggleLeaderboardScreen(targetViewId, controlButton) {
            currentActiveView = targetViewId.toLowerCase().trim();
            
            document.querySelectorAll('.nav-tab-trigger').forEach(btn => btn.classList.remove('active-trigger'));
            if (controlButton) controlButton.classList.add('active-trigger');
            
            const cardOverlay = document.getElementById('player-profile-view-container');
            if (cardOverlay) cardOverlay.classList.remove('active-modal');

            const kitDropdown = document.getElementById('kit-filter-select-node');
            if (kitDropdown) {
                if (kitColumnMap[currentActiveView]) {
                    kitDropdown.value = currentActiveView;
                    kitDropdown.disabled = true;
                } else {
                    kitDropdown.value = 'all';
                    kitDropdown.disabled = false;
                }
            }

            evaluateViewRefreshRouter();
        }

        function applyAdvancedMatrixFilters() { evaluateViewRefreshRouter(); }
        function evaluateLiveSearchFilters() { evaluateViewRefreshRouter(); }

        function evaluateViewRefreshRouter() {
            const headerNode = document.getElementById('board-display-header-title');
            const podiumSpot = document.getElementById('podium-arena-injection-spot');

            if (currentActiveView === 'overall') {
                if (headerNode) headerNode.innerText = "Overall Rankings Menu";
                if (podiumSpot) podiumSpot.innerHTML = "";
                renderOverallStandardBoard();
            } else if (kitColumnMap[currentActiveView]) {
                if (headerNode) headerNode.innerText = currentActiveView.toUpperCase() + " Board";
                rebuildKitBoardMatrix(kitColumnMap[currentActiveView]);
            }
        }

        // Standard Home List Board Layout Generator (Rows feature miniature weapon kit columns)
        function renderOverallStandardBoard() {
            const targetCell = document.getElementById('overall-players-list-target');
            if (!targetCell) return;

            const activeDataset = getFilteredCollection('overall');
            const sortedRoster = activeDataset.sort((a, b) => b.points - a.points);

            if (sortedRoster.length === 0) {
                targetCell.innerHTML = '<div style="text-align:center; padding:40px; font-family:\'MulticraftCustom\', monospace; color:rgba(255,255,255,0.25); font-size:0.75rem;">NO COMPETITORS FOUND MATCHING CRITERIA</div>';
                return;
            }

            let htmlString = '';
            sortedRoster.forEach((player, index) => {
                const regionPill = player.region.toLowerCase() === 'na' ? 'pill-na' : 'pill-eu';
                let devicePill = 'pill-pc';
                if (player.device.toLowerCase() === 'mobile') devicePill = 'pill-mob';
                if (player.device.toLowerCase() === 'controller') devicePill = 'pill-con';

                const eVal = player.emerald === 'TBD' ? '-' : player.emerald;
                const dVal = player.dragonhide === 'TBD' ? '-' : player.dragonhide;
                const mVal = player.diamond === 'TBD' ? '-' : player.diamond;

                htmlString += '<div class="roster-card-row" onclick="setActivePlayerParam(\'' + player.name + '\')">' +
                    '<div class="row-rank-num">#' + (index + 1) + '</div>' +
                    '<div class="row-avatar-box">' +
                        '<img src="https://mc-heads.net' + player.name + '/32" alt="Face" onerror="this.src=\'https://mc-heads.netSteve/32\'">' +
                    '</div>' +
                    '' +
                        '<div class="row-player-name">' + player.name + '</div>' +
                        '<div class="row-custom-title">' + player.rankTitle + '</div>' +
                    '</div>' +
                    '<div class="row-capsules-block">' +
                        '<span class="table-pill ' + regionPill + '">' + player.region + '</span>' +
                        '<span class="table-pill ' + devicePill + '">' + player.device.substring(0,3) + '</span>' +
                    '</div>' +
                    '<div class="row-mini-kits-matrix">' +
                        '<div class="row-mini-kit-slot ' + (eVal === '-' ? 'empty-matrix-slot' : '') + '"><img src="https://minecraft.wiki" class="row-mini-kit-icon"><span class="row-mini-kit-tier">' + eVal + '</span></div>' +
                        '<div class="row-mini-kit-slot ' + (dVal === '-' ? 'empty-matrix-slot' : '') + '"><img src="https://minecraft.wiki" class="row-mini-kit-icon"><span class="row-mini-kit-tier">' + dVal + '</span></div>' +
                        '<div class="row-mini-kit-slot ' + (mVal === '-' ? 'empty-matrix-slot' : '') + '"><img src="https://minecraft.wiki" class="row-mini-kit-icon"><span class="row-mini-kit-tier">' + mVal + '</span></div>' +
                    '</div>' +
                    '<div class="row-score-block">' +
                        '<div class="row-points-total">' + player.points + '<span>PTS</span></div>' +
                    '</div>' +
                '</div>';
            });
            
            targetCell.innerHTML = htmlString;
        }

        // Live Sub-Screen Generator: Populates 3D Medalist Podiums & 5-Column Division Grids
        function rebuildKitBoardMatrix(columnKey) {
            const targetCell = document.getElementById('overall-players-list-target');
            const podiumSpot = document.getElementById('podium-arena-injection-spot');
            if (!targetCell || !podiumSpot) return;

            const activeDataset = getFilteredCollection('kit');
            const stacks = { "T1": [], "T2": [], "T3": [], "T4": [], "T5": [] };
            let eligibleList = [];

            activeDataset.forEach(player => {
                const rawTier = player[columnKey];
                if (!rawTier || rawTier === 'TBD') return;
                
                const tierNumber = rawTier.substring(2); 
                const targetStackKey = 'T' + tierNumber;
                
                if (stacks[targetStackKey]) {
                    const regionPill = player.region.toLowerCase() === 'na' ? 'pill-na' : 'pill-eu';
                    let devicePill = 'pill-pc';
                    if (player.device.toLowerCase() === 'mobile') devicePill = 'pill-mob';
                    if (player.device.toLowerCase() === 'controller') devicePill = 'pill-con';

                    const layoutHtml = '<div class="mini-kit-card" onclick="setActivePlayerParam(\'' + player.name + '\')">' +
                        '<div class="mini-card-name">' + player.name + '</div>' +
                        '<div class="mini-card-row">' +
                            '<div>' +
                                '<span class="table-pill ' + regionPill + '" style="font-size:0.5rem; padding:1px 4px; margin-right:4px;">' + player.region + '</span>' +
                                '<span class="table-pill ' + devicePill + '" style="font-size:0.5rem; padding:1px 4px;">' + player.device.substring(0,3) + '</span>' +
                            '</div>' +
                            '<div class="mini-card-tier">' + rawTier + '</div>' +
                        '</div>' +
                    '</div>';
                    
                    const playerPayload = { html: layoutHtml, tier: rawTier, name: player.name };
                    stacks[targetStackKey].push(playerPayload);
                    eligibleList.push(playerPayload);
                }
            });
