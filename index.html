<!DOCTYPE html>
<html lang="en)
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicraft Island Tiers</title>
    <style>
        /* Base page layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            min-height: 100vh;
            box-sizing: border-box;
            background-color: #0b1d28; /* Dark night sky backdrop */
            position: relative;
            overflow-x: hidden;
        }

        /* Fullscreen falling stars background canvas */
        #starfall-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .logo-container {
            max-width: 600px;
            width: 100%;
            margin-bottom: 20px;
            text-align: center;
            z-index: 1;
        }

        .logo-container img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
        }

        /* Navigation Menu Buttons */
        .navigation-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 800px;
            z-index: 1;
        }

        .nav-btn {
            background-color: #1a4d47;
            color: white;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #2b7a71;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        .nav-btn.overall-btn {
            background-color: #e67e22;
        }
        .nav-btn.overall-btn:hover, .nav-btn.overall-btn.active {
            background-color: #d35400;
        }

        /* Views Container */
        .view-section {
            display: none;
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
            z-index: 1;
        }

        .view-section.active {
            display: block;
        }

        /* Overall Table Styling */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .leaderboard-table th {
            background-color: #2b7a71;
            color: white;
        }

        .clickable-name {
            color: #2b7a71;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }

        .clickable-name:hover {
            color: #1a4d47;
        }

        /* Player Card Individual View */
        .player-card-detail {
            background: white;
            border: 2px solid #2b7a71;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }

        .player-card-title {
            font-size: 1.8rem;
            color: #1a4d47;
            margin-top: 0;
            border-bottom: 3px solid #64f3e5;
            padding-bottom: 5px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            background: #f7f9f9;
            padding: 10px;
            border-radius: 6px;
        }

        /* Kit View Tiers Layout */
        .tier-group {
            margin-bottom: 20px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        .tier-header {
            color: white;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .tier-header.ht { background: #b23b3b; }
        .tier-header.lt { background: #3b7bb2; }
        .tier-header.tbd { background: #7f8c8d; }

        .tier-list {
            padding: 10px 15px;
            list-style: none;
            margin: 0;
        }

        .tier-list li {
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        .tier-list li:last-child {
            border-bottom: none;
        }

        .back-btn {
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Animated Canvas Layer -->
    <canvas id="starfall-canvas"></canvas>

    <!-- Logo -->
    <div class="logo-container">
        <img src="logo.png" alt="Multicraft Island Tiers Logo">
    </div>

    <!-- Navigation Buttons Menu -->
    <div class="navigation-menu">
        <button class="nav-btn overall-btn active" onclick="switchView('overall-view')">Overall Leaderboard</button>
        <button class="nav-btn" onclick="switchKitView('Dragonhide')">Dragonhide</button>
        <button class="nav-btn" onclick="switchKitView('Dragonhide KB')">Dragonhide KB</button>
        <button class="nav-btn" onclick="switchKitView('Emerald')">Emerald</button>
        <button class="nav-btn" onclick="switchKitView('Diamond')">Diamond</button>
        <button class="nav-btn" onclick="switchKitView('Emerald KB')">Emerald KB</button>
    </div>

    <!-- 1. OVERALL LEADERBOARD VIEW -->
    <div id="overall-view" class="view-section active">
        <h2>Overall Rankings</h2>
        <p>Click a player's name to view their complete Player Card and Tiers.</p>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Region</th>
                    <th>Device</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>#1</td>
                    <td><span class="clickable-name" onclick="showPlayerCard('Husky_Multicraft')">Husky_Multicraft</span></td>
                    <td>NA</td>
                    <td>PC</td>
                    <td><strong>300</strong></td>
                </tr>
                <tr>
                    <td>#2</td>
                    <td><span class="clickable-name" onclick="showPlayerCard('prologozrock')">prologozrock</span></td>
                    <td>NA</td>
                    <td>PC</td>
                    <td><strong>150</strong></td>
                </tr>
                <tr>
                    <td>#3</td>
                    <td><span class="clickable-name" onclick="showPlayerCard('Server_pvp')">Server_pvp</span></td>
                    <td>NA</td>
                    <td>Mobile</td>
                    <td><strong>140</strong></td>
                </tr>
                <tr>
                    <td>#4</td>
                    <td><span class="clickable-name" onclick="showPlayerCard('taxbird')">taxbird</span></td>
                    <td>NA</td>
                    <td>Mobile</td>
                    <td><strong>0</strong></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 2. INDIVIDUAL PLAYER CARD VIEW -->
    <div id="player-view" class="view-section">
        <button class="back-btn" onclick="switchView('overall-view')">← Back to Leaderboard</button>
        <div id="player-card-container">
            <!-- Filled out dynamically by JavaScript -->
        </div>
    </div>

    <!-- 3. DYNAMIC KITS TIER VIEW -->
    <div id="kit-view" class="view-section">
        <h2 id="kit-view-title">Kit Tiers</h2>
        <div id="tier-groups-container">
            <!-- Tier buckets filled dynamically by JavaScript -->
        </div>
    </div>

    <!-- JAVASCRIPT CONTROLLERS -->
    <script>
        // Central Player Database
        const playersDatabase = {
            "Husky_Multicraft": {
                name: "Husky_Multicraft", region: "NA", device: "PC", points: 300,
                tiers: { "Dragonhide": "HT3", "Dragonhide KB": "HT3", "Emerald": "LT2", "Diamond": "HT3", "Emerald KB": "LT3" }
            },
            "prologozrock": {
                name: "prologozrock", region: "NA", device: "PC", points: 150,
                tiers: { "Dragonhide": "LT4", "Dragonhide KB": "LT4", "Emerald": "LT3", "Diamond": "HT4", "Emerald KB": "TBD" }
            },
            "Server_pvp": {
                name: "Server_pvp", region: "NA", device: "Mobile", points: 140,
                tiers: { "Dragonhide": "LT4", "Dragonhide KB": "LT4", "Emerald": "HT5", "Diamond": "HT4", "Emerald KB": "HT5" }
            },
            "taxbird": {
                name: "taxbird", region: "NA", device: "Mobile", points: 50,
                tiers: { "Dragonhide": "LT5", "Dragonhide KB": "LT5", "Emerald": "LT5", "Diamond": "LT5", "Emerald KB": "LT5" }
            }
        };

        // Screen swapper helper function
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(viewId).classList.add('active');
