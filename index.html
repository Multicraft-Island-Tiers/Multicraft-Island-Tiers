    <style>
        /* Load your exact font file extension locally */
        @font-face {
            font-family: 'MulticraftCustom';
            src: url('MultiCraftFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;

            background-image: radial-gradient(circle at 50% 50%, rgba(10, 24, 38, 0.75) 0%, rgba(2, 7, 12, 1) 100%);

        /* CORE GRID MATRIX LAYER: Keeps leaderboard and sidebar locked side-by-side forever */

            display: flex;

            gap: 25px; 
            width: 100%; 
            max-width: 1250px; 
            align-items: flex-start;
            box-sizing: border-box;
        }
        
        /* Left main viewport panel containing player card rows */

            flex: 3; 
            background: rgba(4, 11, 18, 0.45); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 14px; 
            padding: 22px; 
            box-sizing: border-box; 
            backdrop-filter: blur(12px); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);

            flex-direction: column; 
            min-width: 0;

    <!-- REAL-TIME INTERACTIVE FILTER ENGINE -->
    <script>
        let currentKitFilter = 'all';

        function filterKit(kitName, btnElement) {
            document.querySelectorAll('.kit-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentKitFilter = kitName;
            applyGlobalFilters();
        }

        function applyGlobalFilters() {
            const rows = Array.from(document.querySelectorAll('.roster-card-row'));
            
            rows.forEach(row => {
                const connectedKits = row.getAttribute('data-kits').split(',');
                const matchesKit = (currentKitFilter === 'all' || connectedKits.includes(currentKitFilter));
                
                if (matchesKit) {
                    row.classList.remove('hidden');
                } else {
                    row.classList.add('hidden');
                }
            });

            const listContainer = document.getElementById('roster-list-container');
            const sortedRows = rows.filter(r => !r.classList.contains('hidden'))
                                   .sort((a, b) => parseInt(b.getAttribute('data-points')) - parseInt(a.getAttribute('data-points')));

            let visibleRankCounter = 1;
            sortedRows.forEach(row => {
                row.classList.remove('visible-rank-1', 'visible-rank-2', 'visible-rank-3');
                row.querySelector('.row-rank-num').innerText = "#" + visibleRankCounter;
                
                if (visibleRankCounter === 1) row.classList.add('visible-rank-1');
                if (visibleRankCounter === 2) row.classList.add('visible-rank-2');
                if (visibleRankCounter === 3) row.classList.add('visible-rank-3');
                
                listContainer.appendChild(row);
                visibleRankCounter++;
            });

            rows.forEach(row => {
                if (!sortedRows.includes(row)) {
                    row.classList.add('hidden');
                }
            });

            const titleElement = document.getElementById('leaderboard-title');
            titleElement.innerText = currentKitFilter === 'all' ? 'Overall Leaderboard' : currentKitFilter.replace('-', ' ') + ' Leaderboard';
        }

        document.addEventListener("DOMContentLoaded", () => {
            applyGlobalFilters();
        });
    </script>
